  .ev-meta{display:flex;gap:10px;align-items:center;font-size:11px;color:#5d97c4;margin-top:10px;}
  .empty{text-align:center;padding:60px 20px;color:#5d97c4;font-size:14px;}

<script>
(async () => {
  const grid = document.getElementById('event-grid');
  const filters = document.getElementById('event-filters');
  const lang = (localStorage.getItem('lang') || document.documentElement.lang || 'tr').slice(0,2);
  const CAT_LABEL = { festival:'Festival', concert:'Konser', market:'Pazar', sport:'Spor', culture:'Kültür', food:'Yemek', other:'Diğer' };
  const empty = { tr:'Yaklaşan etkinlik yok — yakında!', en:'No upcoming events — soon!', de:'Keine kommenden Veranstaltungen.', ru:'Пока нет событий.', fr:'Aucun événement à venir.' };

  function escape(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function eventCard(e) {
    const d = new Date(e.start_at);
    const day = d.toLocaleDateString('tr-TR',{day:'numeric'});
    const mon = d.toLocaleDateString('tr-TR',{month:'short'});
    const t = (e.title && (e.title[lang] || e.title.tr)) || '—';
    const desc = (e.description && (e.description[lang] || e.description.tr)) || '';
    const cat = CAT_LABEL[e.category] || e.category || '';
    return `
      <article class="ev-card" data-cat="${escape(e.category||'other')}">
        <div class="ev-img">
          ${e.image ? `<img src="${escape(e.image)}" alt="${escape(t)}" loading="lazy" />` : ''}
          <div class="ev-date">${escape(day)}<small>${escape(mon)}</small></div>
        </div>
        <div class="ev-body">
          <span class="ev-cat">${escape(cat)}</span>
          <div class="ev-title">${escape(t)}</div>
          <div class="ev-desc">${escape(desc)}</div>
          <div class="ev-meta">${e.location?`<span>📍 ${escape(e.location)}</span>`:''}${e.is_free?`<span style="color:#15803d;">●&nbsp;Ücretsiz</span>`:''}</div>
          ${e.ticket_url?`<a href="${escape(e.ticket_url)}" target="_blank" rel="noopener" class="mt-3 inline-flex items-center justify-center gap-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 px-3 rounded-md font-bold text-xs transition">Bilet / Bilgi →</a>`:''}
        </div>
      </article>`;
  }

  let allEvents = [];
  try {
    const sb = window.SUPABASE_CLIENT;
    if (sb) {
      const { data, error } = await sb
        .from('events')
        .select('id,slug,title,description,start_at,end_at,location,image,category,ticket_url,is_free')
        .eq('status','published')
        .gte('start_at', new Date().toISOString())
        .order('start_at', { ascending: true })
        .limit(50);
      if (!error && data) allEvents = data;
    }
  } catch (e) { console.warn('[events]', e.message); }

  function render(cat) {
    const filtered = cat === 'all' ? allEvents : allEvents.filter(e => e.category === cat);
    if (!filtered.length) {
      grid.innerHTML = `<div class="empty col-span-full">${empty[lang]||empty.tr}</div>`;
      return;
    }
    grid.innerHTML = filtered.map(eventCard).join('');
  }

  render('all');

  filters.addEventListener('click', e => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    filters.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('is-active', b === btn));
    render(btn.dataset.cat);
    if (window.plausible) window.plausible('event_filter', { props: { cat: btn.dataset.cat } });
  });
})();
</script>
