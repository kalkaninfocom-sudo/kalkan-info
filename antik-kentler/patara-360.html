<!doctype html>
<html lang="tr" style="scroll-behavior:smooth;">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Patara 360° — Antik Kenti Keşfet | Kalkan Info</title>
<meta name="description" content="Patara Antik Kenti'ni 360° keşfedin: tiyatro, meclis (bouleuterion), deniz feneri ve ana cadde. 'Şimdi / O Zaman' ile 2000 yıl önce nasıl göründüğünü görün, sesli anlatı eşliğinde gezin.">
<meta name="keywords" content="patara 360, patara antik kenti sanal tur, patara virtual tour, likya patara, kalkan antik kent, patara reconstruction, patara nasıl görünüyordu">
<link rel="canonical" href="https://kalkaninfo.com/antik-kentler/patara-360" />
<link rel="alternate" hreflang="tr" href="https://kalkaninfo.com/antik-kentler/patara-360" />
<link rel="alternate" hreflang="en" href="https://kalkaninfo.com/antik-kentler/patara-360?lang=en" />
<link rel="alternate" hreflang="x-default" href="https://kalkaninfo.com/antik-kentler/patara-360" />
<meta property="og:title" content="Patara 360° — Antik Kenti Keşfet" />
<meta property="og:description" content="Patara'yı 360° gez, 'Şimdi/O Zaman' ile antik hâlini gör." />
<meta property="og:type" content="website" />
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<meta name="theme-color" content="#072136">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
<style>
  :root{ --navy-900:#072136; --navy-800:#0a2e4c; --navy-700:#0c3858; --gold:#f4b53d; --gold-600:#e89812; --line:rgba(255,255,255,.14); }
  *{box-sizing:border-box;}
  html,body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#05111d;color:#eaf2f9;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Montserrat',sans-serif;letter-spacing:-0.02em;}
  a{color:inherit;text-decoration:none;}
  .topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(180deg,rgba(7,33,54,.9),transparent);}
  .logo{font-family:'Montserrat';font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;}
  .logo .diamond{width:13px;height:13px;background:var(--gold);transform:rotate(45deg);border-radius:2px;}
  .logo .info{color:var(--gold);}
  .back{font-size:13px;color:rgba(255,255,255,.85);padding:8px 12px;border-radius:9999px;transition:background .2s;}
  .back:hover{background:rgba(255,255,255,.12);}
  /* Stage */
  .stage{position:relative;height:100vh;width:100%;overflow:hidden;background:#000;}
  #pano{position:absolute;inset:0;}
  #pano.tenzaman{filter:sepia(.55) saturate(1.25) hue-rotate(-8deg) brightness(1.04) contrast(1.05);}
  #pano.tenzaman::after{content:'';}
  .thenwash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .6s ease;background:radial-gradient(120% 90% at 50% 15%,rgba(244,181,61,.20),transparent 55%),linear-gradient(180deg,rgba(122,58,20,.18),rgba(7,33,54,.28));}
  .stage.then .thenwash{opacity:1;}
  /* Hero label */
  .kicker{position:absolute;left:20px;bottom:150px;z-index:12;}
  .kicker .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .kicker h1{font-size:clamp(30px,6vw,54px);font-weight:900;margin:.15em 0 .1em;text-shadow:0 2px 28px rgba(0,0,0,.6);}
  .kicker p{max-width:44ch;color:rgba(255,255,255,.82);font-size:14px;margin:0;text-shadow:0 1px 12px rgba(0,0,0,.7);}
  /* Now/Then toggle */
  .toggle{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:0;background:rgba(7,33,54,.72);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9999px;padding:5px;box-shadow:0 12px 40px -12px rgba(0,0,0,.7);}
  .toggle button{border:0;background:transparent;color:rgba(255,255,255,.8);font-family:'Montserrat';font-weight:800;font-size:13px;padding:11px 22px;border-radius:9999px;cursor:pointer;transition:background .25s,color .25s;letter-spacing:.02em;}
  .toggle button.on{background:var(--gold);color:var(--navy-900);}
  .toggle .sep{width:1px;height:20px;background:var(--line);}
  /* Hotspot chips */
  .spots{position:absolute;right:18px;top:74px;z-index:12;display:flex;flex-direction:column;gap:8px;max-width:210px;}
  .spot{display:flex;align-items:center;gap:9px;background:rgba(7,33,54,.62);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s,background .2s;text-align:left;color:#fff;font-size:13px;font-weight:600;}
  .spot:hover{transform:translateX(-3px);border-color:var(--gold);background:rgba(12,56,88,.8);}
  .spot .n{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy-900);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;}
  /* Lore panel */
  .lore{position:fixed;left:0;bottom:0;right:0;z-index:30;transform:translateY(105%);transition:transform .4s cubic-bezier(.4,0,.2,1);background:linear-gradient(180deg,#0a2e4c,#072136);border-top:3px solid var(--gold);box-shadow:0 -20px 60px rgba(0,0,0,.6);}
  .lore.open{transform:translateY(0);}
  .lore .inner{max-width:820px;margin:0 auto;padding:22px 20px 26px;position:relative;}
  .lore h2{font-size:22px;margin:0 0 4px;}
  .lore .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .lore p{color:rgba(255,255,255,.82);line-height:1.7;font-size:14.5px;margin:10px 0 0;}
  .lore .x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:17px;cursor:pointer;}
  .lore .narr{display:inline-flex;align-items:center;gap:9px;margin-top:16px;background:var(--gold);color:var(--navy-900);font-weight:800;font-family:'Montserrat';font-size:13px;padding:11px 18px;border-radius:9999px;cursor:pointer;}
  .note{position:absolute;left:20px;bottom:100px;z-index:12;font-size:11px;color:rgba(255,255,255,.55);max-width:40ch;}
  @media(max-width:640px){ .kicker{bottom:170px;} .spots{max-width:150px;} .spot{font-size:12px;padding:8px 10px;} }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="pano"></div>
    <div class="thenwash"></div>

    <div class="topbar">
      <a class="logo" href="/">Kalkan <span class="info">Info</span></a>
      <a class="back" href="/antik-kentler/patara.html">← Patara Sayfası</a>
    </div>

    <div class="kicker">
      <div class="k">Antika Kapısı · 360° Keşif</div>
      <h1>Patara</h1>
      <p>Likya Birliği'nin başkenti. Sürükleyerek etrafına bak, noktalara dokunarak keşfet.</p>
    </div>

    <div class="spots" id="spots"></div>

    <div class="note">Demo: mevcut Patara fotoğrafı ile 360° motor. Gerçek 360° çekim + AI "O Zaman" canlandırması eklenecek.</div>

    <div class="toggle" id="toggle">
      <button data-mode="now" class="on">📸 Şimdi</button>
      <div class="sep"></div>
      <button data-mode="then">🏛️ O Zaman</button>
    </div>
  </div>

  <div class="lore" id="lore"><div class="inner">
    <button class="x" id="loreX">×</button>
    <div class="tag" id="loreTag">PATARA</div>
    <h2 id="loreTitle">—</h2>
    <p id="loreBody">—</p>
    <div class="narr" id="loreNarr">🔊 Anlat</div>
  </div></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
/* Gerçek Patara lore (antik-kentler/patara.html'den) */
var SPOTS=[
  {id:'genel', n:'i', pitch:2, yaw:0, title:'Likya\'nın Başkenti', body:'Patara, Likya Birliği\'nin başkenti ve en önemli liman kentiydi. Aziz Nikolaos\'un (Noel Baba) doğduğu yer; dünyanın bilinen en eski deniz fenerlerinden birine ve anıtsal bir meclis binasına ev sahipliği yapar. Bugün UNESCO Dünya Mirası aday listesindedir.'},
  {id:'tiyatro', n:'1', pitch:-3, yaw:-42, title:'Tiyatro', body:'MÖ 2. yüzyıla uzanan, denize bakan yamaca oyulmuş büyük tiyatro. Sahne binasının arkasında kum tepeleri; oturma basamaklarında hâlâ antik yazıtlar okunabilir. Yaklaşık 5.000 kişilik kapasitesiyle kentin kültürel kalbiydi.'},
  {id:'meclis', n:'2', pitch:0, yaw:38, title:'Bouleuterion (Meclis)', body:'Likya Birliği\'nin toplandığı meclis binası — antik dünyanın ilk demokratik federasyon parlamentolarından biri kabul edilir. Restore edilmiş yapı, temsilcilerin oy kullandığı yarım daire oturma düzenini gösterir.'},
  {id:'fener', n:'3', pitch:4, yaw:100, title:'Deniz Feneri', body:'İmparator Neron döneminde (MS 1. yüzyıl) inşa edilen, dünyanın ayakta kalan en eski deniz fenerlerinden biri. Kentin uluslararası ticaret limanı olarak önemini kanıtlar; kalıntıları özenle korunmaktadır.'},
  {id:'cadde', n:'4', pitch:-2, yaw:160, title:'Sütunlu Ana Cadde', body:'Limandan kentin içine uzanan, iki yanı sütunlu görkemli ana cadde. Antik dönemde dükkanlar, anıtlar ve su kanallarıyla çevriliydi — Patara\'nın ticari ve sosyal omurgası.'}
];
var LANG=(new URLSearchParams(location.search).get('lang')||'tr');
var viewer=pannellum.viewer('pano',{
  type:'equirectangular',
  panorama:'/assets/img/patara-wm.jpg',
  autoLoad:true, autoRotate:-2, showControls:false, showZoomCtrl:false, showFullscreenCtrl:false,
  haov:150, vaov:70, vOffset:2, minHfov:60, maxHfov:120, hfov:100, compass:false,
  hotSpots: SPOTS.filter(function(s){return s.id!=='genel';}).map(function(s){
    return {pitch:s.pitch, yaw:s.yaw, cssClass:'', createTooltipFunc:function(el){
      el.innerHTML='<div style="width:30px;height:30px;border-radius:50%;background:#f4b53d;border:3px solid #072136;box-shadow:0 4px 14px rgba(0,0,0,.6);display:grid;place-items:center;font-weight:800;color:#072136;font-family:Montserrat;cursor:pointer;">'+s.n+'</div>';
      el.style.cursor='pointer'; el.onclick=function(){openLore(s.id);};
    }};
  })
});
/* Yan liste */
var spotsEl=document.getElementById('spots');
SPOTS.forEach(function(s){var b=document.createElement('button');b.className='spot';b.innerHTML='<span class="n">'+s.n+'</span>'+s.title;b.onclick=function(){openLore(s.id); if(s.id!=='genel'){try{viewer.setPitch(s.pitch);viewer.setYaw(s.yaw);}catch(e){}}};spotsEl.appendChild(b);});
/* Lore panel */
var lore=document.getElementById('lore');
function openLore(id){var s=SPOTS.filter(function(x){return x.id===id;})[0];if(!s)return;document.getElementById('loreTitle').textContent=s.title;document.getElementById('loreBody').textContent=s.body;lore.classList.add('open');stopNarr();}
document.getElementById('loreX').onclick=function(){lore.classList.remove('open');stopNarr();};
/* Şimdi / O Zaman */
var stage=document.getElementById('stage'), pano=document.getElementById('pano');
document.getElementById('toggle').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var m=b.getAttribute('data-mode');[].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});if(m==='then'){stage.classList.add('then');pano.classList.add('tenzaman');}else{stage.classList.remove('then');pano.classList.remove('tenzaman');}});
/* Anlatı — ses varsa çal, yoksa tarayıcı TTS (yer tutucu; ElevenLabs ses eklenecek) */
var speaking=null;
function stopNarr(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}speaking=null;}
document.getElementById('loreNarr').onclick=function(){var t=document.getElementById('loreBody').textContent;stopNarr();try{var u=new SpeechSynthesisUtterance(t);u.lang=LANG==='en'?'en-US':'tr-TR';u.rate=.98;speechSynthesis.speak(u);speaking=u;}catch(e){}};
/* Açılışta genel lore */
setTimeout(function(){openLore('genel');},900);
</script>
</body>
</html>
