<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Kalkan Info — AjansAI Operasyon Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#071726; --navy2:#0c2438; --card:#0e2a44; --card2:#123453; --line:#1d425f;
    --gold:#e89812; --gold2:#f4b53d; --sea:#4a9ef5; --ink:#eaf3fb; --muted:#7fa3c0;
    --green:#3ad07f; --red:#e0603f; --amber:#f0b429;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:
    radial-gradient(1200px 600px at 85% -10%, rgba(232,152,18,.10), transparent 60%),
    radial-gradient(900px 700px at -5% 110%, rgba(74,158,245,.10), transparent 60%),
    var(--navy);color:var(--ink);min-height:100vh}
  a{color:inherit}
  .mono{font-variant-numeric:tabular-nums}

  /* Gate */
  #gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--navy)}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 30px;width:min(90vw,340px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  #gate .lg{font-family:'Montserrat';font-weight:900;font-size:20px}.lg .d{color:var(--gold)}
  #gate .sub{color:var(--muted);font-size:12px;margin:4px 0 20px;letter-spacing:.1em;text-transform:uppercase}
  #gate input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--navy2);color:var(--ink);font-size:16px;text-align:center;outline:none}
  #gate input:focus{border-color:var(--gold)}
  #gate button{margin-top:14px;width:100%;border:0;background:var(--gold);color:#0a2136;font-family:'Montserrat';font-weight:800;font-size:15px;padding:12px;border-radius:10px;cursor:pointer}
  #gate .err{color:var(--red);font-size:12px;margin-top:10px;display:none}

  /* Header */
  header{position:sticky;top:0;z-index:20;background:rgba(7,23,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hwrap{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{font-family:'Montserrat';font-weight:900;font-size:16px;letter-spacing:.01em}.brand .d{color:var(--gold)}
  .brand small{display:block;font-family:'Inter';font-weight:600;font-size:9px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:1px}
  .live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .live.on .dot{background:var(--green);box-shadow:0 0 0 4px rgba(58,208,127,.18);animation:pulse 2s infinite}
  .live.stale .dot{background:var(--amber)}
  @keyframes pulse{50%{opacity:.5}}
  .clock{margin-left:auto;font-family:'Montserrat';font-weight:800;font-size:14px;color:var(--gold2);background:var(--navy2);padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
  nav.tabs{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
  nav.tabs button{background:none;border:0;color:var(--muted);font-family:'Montserrat';font-weight:700;font-size:13px;padding:12px 16px;cursor:pointer;border-bottom:3px solid transparent}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
  nav.tabs button .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;background:var(--gold);color:#0a2136;border-radius:9px;font-size:10px;font-weight:800}

  main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  .view{display:none}.view.on{display:block}

  /* Stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .stat .v{font-family:'Montserrat';font-weight:900;font-size:26px;margin-top:4px;line-height:1}
  .stat .v.gold{color:var(--gold2)}.stat .v.green{color:var(--green)}.stat .v.amber{color:var(--amber)}

  /* Filter pills */
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pill{background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:12px;padding:7px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .pill.on{background:var(--gold);color:#0a2136;border-color:var(--gold)}

  /* Automations table */
  .tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:grid;grid-template-columns:24px 2.4fr 1fr 1.3fr 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.head{background:var(--navy2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .row:not(.head):hover{background:var(--card2)}
  .sdot{width:11px;height:11px;border-radius:50%;background:var(--muted)}
  .sdot.work{background:var(--green);box-shadow:0 0 0 3px rgba(58,208,127,.2)}
  .sdot.cron{background:var(--sea)}.sdot.idle{background:#4a6178}.sdot.alert{background:var(--red)}
  .a-name{font-family:'Montserrat';font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .a-beat{font-family:'Inter';font-weight:700;font-size:10px;color:var(--gold2);background:rgba(232,152,18,.14);border:1px solid rgba(232,152,18,.3);padding:2px 8px;border-radius:999px}
  .a-role{font-size:10.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
  .badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
  .sched{font-size:11px;color:var(--ink);font-weight:600}
  .ago{font-size:11px;color:var(--muted)}
  .btn{border:0;border-radius:8px;font-family:'Montserrat';font-weight:700;font-size:11px;padding:7px 12px;cursor:pointer}
  .btn.run{background:var(--gold);color:#0a2136}.btn.run:hover{background:var(--gold2)}
  .btn.ghost{background:var(--navy2);color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .rowacts{display:flex;gap:6px}

  /* Görev ver */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .fld{margin-bottom:14px}.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:6px}
  select,textarea,input.txt{width:100%;background:var(--navy2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 13px;font-size:13px;font-family:inherit;outline:none}
  select:focus,textarea:focus,input.txt:focus{border-color:var(--gold)}
  textarea{min-height:90px;resize:vertical}
  .send{background:var(--gold);color:#0a2136;border:0;font-family:'Montserrat';font-weight:800;font-size:14px;padding:12px 22px;border-radius:10px;cursor:pointer}
  #job-out{margin-top:16px;background:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;display:none}
  #job-out.run{color:var(--gold2)}
  #job-out pre{white-space:pre-wrap;font-size:11.5px}

  /* Queue */
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .qcard .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .qtype{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--gold2)}
  .qbody{font-size:12.5px;line-height:1.6;color:var(--ink);max-height:120px;overflow:auto;white-space:pre-wrap}
  .qacts{display:flex;gap:8px;margin-top:12px}
  .btn.ok{background:var(--green);color:#062418}.btn.no{background:var(--red);color:#fff}

  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:13px}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(4,14,24,.7);display:none;place-items:center;padding:20px}
  .modal.on{display:grid}
  .mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;padding:24px;max-height:85vh;overflow:auto}
  .mbox h3{font-family:'Montserrat';font-weight:800;font-size:18px}
  .mbox .mrole{color:var(--muted);font-size:12px;margin:4px 0 14px}
  .mrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .mrow .mk{color:var(--muted);min-width:110px;font-weight:600}
  .mclose{float:right;background:var(--navy2);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:20px 1.6fr auto;gap:8px}.row .col-dept,.row .col-sched,.row .col-ago{display:none}.a-role{max-width:200px}}
</style>
</head>
<body>

<!-- Şifre kapısı -->
<div id="gate"><form class="box">
  <div class="lg">◆ KALKAN <span class="d">INFO</span></div>
  <div class="sub">AjansAI · Operasyon Merkezi</div>
  <input id="pass" type="password" inputmode="numeric" autocomplete="off" autofocus placeholder="Şifre" />
  <button type="submit">Gir</button>
  <div class="err" id="perr">Hatalı şifre</div>
</form></div>

<header>
  <div class="hwrap">
    <div class="brand">◆ KALKAN <span class="d">INFO</span> · AjansAI<small>Operasyon Merkezi</small></div>
    <div class="live" id="live"><span class="dot"></span><span id="live-txt">bağlanıyor…</span></div>
    <div class="clock mono" id="clock">--:--</div>
  </div>
  <nav class="tabs">
    <button data-view="oto" class="on">⚙️ Otomasyonlar</button>
    <button data-view="gorev">📋 Görev Ver</button>
    <button data-view="onay">✅ Onay Kuyruğu<span class="b" id="q-badge" style="display:none">0</span></button>
  </nav>
</header>

<main>
  <!-- OTOMASYONLAR -->
  <section class="view on" id="view-oto">
    <div class="stats">
      <div class="stat"><div class="k">Toplam otomasyon</div><div class="v" id="s-total">—</div></div>
      <div class="stat"><div class="k">Zamanlı (cron)</div><div class="v gold" id="s-cron">—</div></div>
      <div class="stat"><div class="k">Son 24s çalışan</div><div class="v green" id="s-ran">—</div></div>
      <div class="stat"><div class="k">Bekleyen onay</div><div class="v amber" id="s-pend">—</div></div>
    </div>
    <div class="pills" id="pills"></div>
    <div class="tbl" id="oto-tbl">
      <div class="row head"><span></span><span>Otomasyon</span><span class="col-dept">Departman</span><span class="col-sched">Zamanlama</span><span class="col-ago">Son çalışma</span><span>Aksiyon</span></div>
      <div id="oto-rows"></div>
    </div>
  </section>

  <!-- GÖREV VER -->
  <section class="view" id="view-gorev">
    <div class="panel">
      <div class="fld"><label>Çalışan / Agent seç</label><select id="g-agent"></select></div>
      <div class="fld"><label>Görev / talep</label><textarea id="g-task" placeholder="Örn: Bu hafta için villa reel konsepti öner…"></textarea></div>
      <button class="send" id="g-send">Görevi Gönder →</button>
      <div id="job-out"></div>
    </div>
  </section>

  <!-- ONAY KUYRUĞU -->
  <section class="view" id="view-onay">
    <div id="q-list"></div>
  </section>
</main>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
/* ===================== BACKEND ===================== */
const AGENCY_EDGE='https://dgichfealzdpfhdgryym.supabase.co/functions/v1/agency';
const AGENCY_KEY='sb_publishable_26HXaUgGqxZUOuxbcPhiDQ_s3MvKVpr';
const isLocal=['localhost','127.0.0.1'].includes(location.hostname);
function agencyURL(p){
  if(isLocal || !p.startsWith('/agency/')) return {url:p,headers:{}};
  return {url:AGENCY_EDGE+p.slice('/agency'.length),headers:{apikey:AGENCY_KEY,Authorization:'Bearer '+AGENCY_KEY}};
}
async function apiGET(p){const t=agencyURL(p);const r=await fetch(t.url,{cache:'no-store',headers:t.headers});if(!r.ok)throw new Error('http '+r.status);return r.json();}
async function apiPOST(p,body){const t=agencyURL(p);const r=await fetch(t.url,{method:'POST',headers:{'Content-Type':'application/json',...t.headers},body:JSON.stringify(body)});if(!r.ok)throw new Error('http '+r.status);return r.json();}

/* ===================== STATE ===================== */
const DEPT={}, DEPT_LIST=[]; let AGENTS={}, STATE={}, QUEUE=[]; let liveOn=false, curFilter='all';
const STATUS_META={work:{t:'çalışıyor',c:'work'},cron:{t:'zamanlı',c:'cron'},idle:{t:'boşta',c:'idle'},alert:{t:'dikkat',c:'alert'},done:{t:'tamam',c:'work'}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(iso){ if(!iso) return '—'; const d=(Date.now()-new Date(iso).getTime())/1000; if(isNaN(d))return '—';
  if(d<60)return 'az önce'; if(d<3600)return Math.floor(d/60)+' dk önce'; if(d<86400)return Math.floor(d/3600)+' sa önce'; return Math.floor(d/86400)+' gün önce'; }
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
function setLive(on,stale){const el=document.getElementById('live');liveOn=on;el.className='live'+(on?' on':'')+(stale?' stale':'');
  document.getElementById('live-txt').textContent=on?'canlı':(stale?'çevrimdışı (yerel veri)':'yerel veri');}

/* ===================== DATA LOAD ===================== */
async function loadData(){
  const [depts,agents]=await Promise.all([apiGET('/data/agency/departments.json'),apiGET('/data/agency/agents.json')]);
  (depts.departmanlar||[]).forEach(d=>{DEPT[d.id]=d;DEPT_LIST.push(d);});
  AGENTS=agents.agents||{};
  // yerel son-durum (canlı yoksa)
  try{const s=await apiGET('/data/agency/state.json');STATE=s.agents||{};}catch(_){}
  try{const q=await apiGET('/data/agency/content-queue.json');QUEUE=Array.isArray(q)?q:(q.items||q.queue||[]);}catch(_){}
  // canlı dene
  await pollLive();
}
async function pollLive(){
  try{
    const j=await apiGET('/agency/status');
    if(j.state&&j.state.agents) STATE={...STATE,...j.state.agents};
    if(j.content) QUEUE=j.content;
    setLive(true,false);
  }catch(_){ setLive(false, liveEver); }
}
let liveEver=false;
const _origSetLive=setLive; // liveEver izle
setLive=function(on,stale){ if(on)liveEver=true; _origSetLive(on,stale); };

/* ===================== RENDER: OTOMASYONLAR ===================== */
function agentDept(id){ const d=DEPT_LIST.find(x=>(x.agents||[]).includes(id)); return d||{id:'',ad:'',accent:'#7fa3c0',emoji:''}; }
function statusOf(id){ const s=STATE[id]; const meta=AGENTS[id]; if(s&&s.status)return s.status; if(meta&&meta.schedule&&meta.schedule.type==='cron')return 'cron'; return 'idle'; }
function schedLabel(id){ const m=AGENTS[id]; if(!m||!m.schedule)return 'Tetik: canlı'; return m.schedule.label||(m.schedule.type==='cron'?'Zamanlı':'Tetik'); }

function renderPills(){
  const el=document.getElementById('pills');
  const counts={all:Object.keys(AGENTS).length};
  DEPT_LIST.forEach(d=>counts[d.id]=(d.agents||[]).filter(id=>AGENTS[id]).length);
  el.innerHTML=`<div class="pill ${curFilter==='all'?'on':''}" data-f="all">Tümü <b>${counts.all}</b></div>`+
    DEPT_LIST.map(d=>`<div class="pill ${curFilter===d.id?'on':''}" data-f="${d.id}" style="${curFilter===d.id?'':'border-color:'+d.accent+'55'}">${d.emoji} ${esc(d.ad.split(' ')[0])} <b>${counts[d.id]}</b></div>`).join('');
  el.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{curFilter=p.dataset.f;renderPills();renderRows();});
}
function idsForFilter(){
  if(curFilter==='all') return Object.keys(AGENTS);
  return (DEPT[curFilter]?.agents||[]).filter(id=>AGENTS[id]);
}
function renderRows(){
  const wrap=document.getElementById('oto-rows');
  const ids=idsForFilter();
  if(!ids.length){wrap.innerHTML='<div class="empty">Bu departmanda otomasyon yok.</div>';return;}
  wrap.innerHTML=ids.map(id=>{
    const m=AGENTS[id]||{}, d=agentDept(id), st=statusOf(id), sm=STATUS_META[st]||STATUS_META.idle;
    const last=STATE[id]&&STATE[id].lastRun;
    return `<div class="row" data-id="${id}">
      <span class="sdot ${sm.c}" title="${sm.t}"></span>
      <div><div class="a-name">${esc(m.person||m.name||id)}${m.beat?`<span class="a-beat">${esc(m.beat)}</span>`:''}</div><div class="a-role">${esc(m.role||'')}</div></div>
      <span class="col-dept"><span class="badge" style="background:${d.accent}22;color:${d.accent}">${d.emoji} ${esc((d.ad||'').split(' ')[0])}</span></span>
      <span class="col-sched sched">${esc(schedLabel(id))}</span>
      <span class="col-ago ago">${ago(last)}</span>
      <span class="rowacts"><button class="btn run" data-run="${id}">Çalıştır</button><button class="btn ghost" data-det="${id}">Detay</button></span>
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runAgent(b.dataset.run,b));
  wrap.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>showDetail(b.dataset.det));
}
function renderStats(){
  const ids=Object.keys(AGENTS);
  document.getElementById('s-total').textContent=ids.length;
  document.getElementById('s-cron').textContent=ids.filter(id=>AGENTS[id].schedule&&AGENTS[id].schedule.type==='cron').length;
  const ran=ids.filter(id=>{const l=STATE[id]&&STATE[id].lastRun;return l&&(Date.now()-new Date(l))<86400000;}).length;
  document.getElementById('s-ran').textContent=ran;
  const pend=QUEUE.filter(q=>(q.status||'').includes('pending')).length;
  document.getElementById('s-pend').textContent=pend;
  const badge=document.getElementById('q-badge');
  if(pend>0){badge.style.display='';badge.textContent=pend;}else badge.style.display='none';
}

/* ===================== ÇALIŞTIR / GÖREV VER ===================== */
async function runAgent(id,btn){
  if(!liveOn){toast('⚠ Canlı backend gerekli (yerel modda tetikleme yok)');return;}
  const old=btn.textContent;btn.disabled=true;btn.textContent='…';
  try{ await apiPOST('/agency/enqueue',{agent:id,task:'Manuel tetikleme (operasyon merkezi)'}); toast('▶ '+(AGENTS[id].name||id)+' tetiklendi'); }
  catch(e){ toast('✗ Hata: '+e.message); }
  finally{ btn.disabled=false;btn.textContent=old; setTimeout(pollLive,1500); }
}
function fillAgentSelect(){
  const sel=document.getElementById('g-agent');
  sel.innerHTML=DEPT_LIST.map(d=>`<optgroup label="${d.emoji} ${esc(d.ad)}">`+
    (d.agents||[]).filter(id=>AGENTS[id]).map(id=>`<option value="${id}">${esc(AGENTS[id].person||AGENTS[id].name||id)} — ${esc(AGENTS[id].beat||AGENTS[id].role||'')}</option>`).join('')+`</optgroup>`).join('');
}
async function sendTask(){
  const id=document.getElementById('g-agent').value, task=document.getElementById('g-task').value.trim();
  const out=document.getElementById('job-out');
  if(!task){toast('Görev metni gir');return;}
  if(!liveOn){out.style.display='';out.className='';out.textContent='⚠ Canlı backend gerekli — yerel modda görev gönderilemez. (Prod: kalkaninfo.com/ajansAI)';return;}
  out.style.display='';out.className='run';out.textContent='⏳ Gönderiliyor…';
  try{
    const r=await apiPOST('/agency/enqueue',{agent:id,task});
    const jobId=r.jobId||r.id;
    out.textContent='⏳ '+(AGENTS[id].name||id)+' çalışıyor…';
    let tries=0; const iv=setInterval(async()=>{
      tries++; let j; try{j=await apiGET('/agency/status');}catch(_){ if(tries>20)clearInterval(iv); return; }
      const job=(j.jobs||[]).find(x=>x.id===jobId);
      if(job&&(job.status==='done'||job.result)){ clearInterval(iv); out.className='';
        out.innerHTML='<b>✓ '+esc(AGENTS[id].name||id)+':</b>\n'+esc(job.result||job.output||'(çıktı yok)'); }
      else if(tries>20){ clearInterval(iv); out.className=''; out.textContent='Sonuç zaman aşımı — /agency/status kontrol et.'; }
    },2500);
  }catch(e){ out.className='';out.textContent='✗ Hata: '+e.message; }
}

/* ===================== ONAY KUYRUĞU ===================== */
function renderQueue(){
  const el=document.getElementById('q-list');
  const pend=QUEUE.filter(q=>(q.status||'').includes('pending'));
  if(!pend.length){el.innerHTML='<div class="empty">Bekleyen onay yok. 🎉</div>';return;}
  el.innerHTML=pend.map(q=>{
    const body=q.decision||q.caption||q.content||q.text||JSON.stringify(q).slice(0,300);
    return `<div class="qcard" data-cid="${q.id}">
      <div class="qhead"><span class="qtype">${esc(q.type||'içerik')}</span><span class="ago">${ago(q.createdAt)}</span></div>
      <div class="qbody">${esc(typeof body==='string'?body:JSON.stringify(body,null,2))}</div>
      <div class="qacts"><button class="btn ok" data-ap="${q.id}">✓ Paylaş</button><button class="btn no" data-rj="${q.id}">✕ Reddet</button></div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>decide(b.dataset.ap,'approve'));
  el.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>decide(b.dataset.rj,'reject'));
}
async function decide(cid,act){
  if(!liveOn){toast('⚠ Canlı backend gerekli');return;}
  try{ await apiPOST('/agency/approve',{contentId:cid,decision:act}); toast(act==='approve'?'✓ Onaylandı':'✕ Reddedildi');
    QUEUE=QUEUE.filter(q=>q.id!==cid); renderQueue();renderStats(); }
  catch(e){ toast('✗ Hata: '+e.message); }
}

/* ===================== DETAY MODAL ===================== */
function showDetail(id){
  const m=AGENTS[id]||{}, d=agentDept(id), s=STATE[id]||{};
  const wf=(m.workflows||[]).join(', ');
  document.getElementById('mbox').innerHTML=`<button class="mclose" onclick="document.getElementById('modal').classList.remove('on')">×</button>
    <h3>${esc(m.person||m.name||id)} <span style="font-size:12px;color:var(--gold2);font-weight:700">· ${esc(m.beat||'')}</span></h3><div class="mrole">${esc(m.name||id)} — ${esc(m.role||'')}</div>
    <div class="mrow"><span class="mk">Çalıştığı alan</span><span>${esc(m.beat||'—')}${m.beatUrl?` · <a href="..${esc(m.beatUrl)}" target="_blank" style="color:var(--sea)">${esc(m.beatUrl)}</a>`:''}</span></div>
    <div class="mrow"><span class="mk">Departman</span><span>${d.emoji} ${esc(d.ad)}</span></div>
    <div class="mrow"><span class="mk">Model</span><span>${esc(m.model||'—')}</span></div>
    <div class="mrow"><span class="mk">Zamanlama</span><span>${esc(schedLabel(id))}</span></div>
    ${wf?`<div class="mrow"><span class="mk">Workflow</span><span>${esc(wf)}</span></div>`:''}
    <div class="mrow"><span class="mk">Son çalışma</span><span>${ago(s.lastRun)}</span></div>
    ${s.lastOutput?`<div class="mrow" style="flex-direction:column;gap:5px"><span class="mk">Son çıktı</span><span style="color:var(--muted);font-size:11.5px;line-height:1.5">${esc(String(s.lastOutput).slice(0,400))}</span></div>`:''}
    ${m.system?`<div class="mrow" style="flex-direction:column;gap:5px"><span class="mk">Görev tanımı</span><span style="color:var(--muted);font-size:11px;line-height:1.5">${esc(m.system.slice(0,300))}</span></div>`:''}`;
  document.getElementById('modal').classList.add('on');
}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on');};

/* ===================== TABS & CLOCK ===================== */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-'+b.dataset.view).classList.add('on');
  if(b.dataset.view==='onay')renderQueue();
});
function tickClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+' · Kalkan';}
setInterval(tickClock,1000);tickClock();

/* ===================== INIT ===================== */
async function boot(){
  try{ await loadData(); }catch(e){ document.getElementById('oto-rows').innerHTML='<div class="empty">Veri yüklenemedi: '+esc(e.message)+'</div>'; return; }
  renderPills();renderRows();renderStats();fillAgentSelect();renderQueue();
  document.getElementById('g-send').onclick=sendTask;
  setInterval(async()=>{await pollLive();renderRows();renderStats();},8000);
}

/* Şifre kapısı */
(function(){
  const PASS='123', SS='kalkan_ajansai_gate';
  const gate=document.getElementById('gate'), form=gate.querySelector('form'), inp=document.getElementById('pass'), err=document.getElementById('perr');
  if(sessionStorage.getItem(SS)==='1'){ gate.remove(); boot(); return; }
  form.addEventListener('submit',e=>{e.preventDefault();
    if(inp.value===PASS){ try{sessionStorage.setItem(SS,'1');}catch(_){}; gate.remove(); boot(); }
    else{ err.style.display='block'; inp.value=''; inp.focus(); }
  });
})();
