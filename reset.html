<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalkan Info — Site Sıfırlama</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230d3a5f'/></svg>">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#0a2e4c 0%,#072136 100%);color:#fff;display:flex;align-items:center;justify-content:center}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:18px;padding:36px 32px;max-width:520px;width:calc(100% - 32px);text-align:center;box-shadow:0 24px 60px -16px rgba(0,0,0,0.4)}
  h1{font-family:'Montserrat',system-ui,sans-serif;font-weight:900;letter-spacing:-0.02em;font-size:28px;margin:0 0 12px}
  p{margin:8px 0;line-height:1.6;color:#cfdde9}
  .status{margin-top:20px;padding:14px 16px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(232,152,32,0.35);font-size:14px;color:#ffd089;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  .status.done{border-color:rgba(74,222,128,0.45);color:#a6f3c2}
  .status.error{border-color:rgba(248,113,113,0.45);color:#fca5a5}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.25);border-top-color:#e89812;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  a.btn{display:inline-block;margin-top:18px;padding:12px 24px;background:#e89812;color:#072136;font-weight:700;border-radius:10px;text-decoration:none;transition:transform .15s ease, box-shadow .15s ease}
  a.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(232,152,32,0.45)}
  .tiny{margin-top:14px;font-size:12px;color:#7d96ac}
</style>
</head>
<body>
<main class="card">
  <h1>Site Sıfırlanıyor</h1>
  <p>Tarayıcıda kalan eski önbellek ve servis çalışanları temizleniyor.</p>
  <div id="status" class="status"><span class="spinner"></span><span id="msg">Temizlik başlatılıyor…</span></div>
  <a class="btn" href="https://www.kalkaninfo.com/?fresh=1" id="manualBtn" style="display:none">Siteye Dön</a>
  <p class="tiny">Otomatik yönlendirme 3 saniye sonra.</p>
</main>
<script>
(function(){
  var statusEl=document.getElementById('status');
  var msgEl=document.getElementById('msg');
  var btn=document.getElementById('manualBtn');
  function setMsg(t){msgEl.textContent=t}
  function done(t){statusEl.classList.add('done');statusEl.innerHTML='✓ '+t;btn.style.display='inline-block'}
  function err(t){statusEl.classList.add('error');statusEl.innerHTML='! '+t;btn.style.display='inline-block'}
  async function cleanup(){
    try{
      setMsg('Servis çalışanları kaldırılıyor…');
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function(r){return r.unregister().catch(function(){})}));
      }
      setMsg('Önbellek depoları temizleniyor…');
      if('caches' in window){
        var keys=await caches.keys();
        await Promise.all(keys.map(function(k){return caches.delete(k).catch(function(){})}));
      }
      setMsg('Yerel veri temizleniyor…');
      try{
        var rm=[];
        for(var i=0;i<localStorage.length;i++){
          var k=localStorage.key(i);
          if(k && (k.indexOf('kalkan')===0 || k.indexOf('ki_')===0 || k==='kalkan_info_admin_v1')) rm.push(k);
        }
        rm.forEach(function(k){try{localStorage.removeItem(k)}catch(_){}});
      }catch(_){}
      try{sessionStorage.clear()}catch(_){}
      setMsg('IndexedDB temizleniyor…');
      try{
        if(indexedDB && indexedDB.databases){
          var dbs=await indexedDB.databases();
          await Promise.all((dbs||[]).map(function(db){return new Promise(function(res){
            try{var req=indexedDB.deleteDatabase(db.name);req.onsuccess=req.onerror=req.onblocked=function(){res()}}catch(_){res()}
          })}));
        }
      }catch(_){}
      done('Temizlik tamam. Yönlendiriliyor…');
      setTimeout(function(){location.href='https://www.kalkaninfo.com/?fresh='+Date.now()},2500);
    }catch(e){
      err('Hata: '+(e&&e.message||'bilinmeyen'));
    }
  }
  if(document.readyState==='complete'||document.readyState==='interactive') cleanup();
  else document.addEventListener('DOMContentLoaded',cleanup);
})();
</script>
</body>
</html>
