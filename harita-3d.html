<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Keşfet — Kalkan 3B İnteraktif Harita | kalkaninfo.com</title>
<meta name="description" content="Kalkan'ın 3B interaktif haritası: restoranlar, oteller, villalar ve plajlar tek haritada. Filtrele, keşfet, yol tarifi al. Gerçek konum verisiyle." />
<link rel="canonical" href="https://kalkaninfo.com/harita-3d" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --gold:#E8A020; --gold-d:#C6851A; --teal:#2FA6A0; --coral:#F0785A;
    --purple:#8B5CF6; --green:#3FA34D; --blue:#4A9EF5;
    --cream:#FAF6EF; --ink:#2A2320; --muted:#7A6E63;
    --panel:rgba(255,255,255,0.92); --line:rgba(42,35,32,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);overflow:hidden}
  #map{position:absolute;inset:0}

  /* ── Üst bar (açık, marka + geri) ── */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;background:linear-gradient(180deg,rgba(250,246,239,0.96),rgba(250,246,239,0.55) 70%,transparent);pointer-events:none}
  .topbar > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:9px;font-family:'Fraunces';font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
  .brand b{color:var(--gold-d)}
  .back-link{font-family:'Inter';font-weight:600;font-size:13px;color:var(--ink);text-decoration:none;
    background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(42,35,32,0.08);transition:.2s}
  .back-link:hover{background:#fff;transform:translateY(-1px)}

  /* ── Filtre çubuğu (üst, açık pill'ler) ── */
  .filters{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    max-width:94vw;padding:0 8px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:'Inter';font-weight:600;font-size:12.5px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:99px;
    box-shadow:0 4px 14px rgba(42,35,32,0.07);transition:.18s;user-select:none}
  .chip:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(42,35,32,0.12)}
  .chip .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .chip.off{opacity:.42;filter:grayscale(.5)}
  .chip.off .cdot{box-shadow:none}

  /* ── Alt kontrol paneli ── */
  .panel{position:absolute;left:16px;bottom:16px;z-index:10;background:var(--panel);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:16px;padding:13px 15px;max-width:230px;box-shadow:0 10px 30px rgba(42,35,32,0.13)}
  .panel h3{font-family:'Fraunces';font-weight:700;font-size:14px;margin-bottom:4px;color:var(--ink)}
  .panel .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .btns{display:flex;gap:7px}
  .btn{flex:1;font-family:'Inter';font-weight:700;font-size:12px;cursor:pointer;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:9px;border-radius:10px;transition:.18s}
  .btn:hover{background:var(--cream)}
  .btn.active{background:var(--gold);border-color:var(--gold);color:#fff}
  .count{font-size:11.5px;color:var(--teal);font-weight:600;margin-top:10px}

  /* ── Popup kart (açık) ── */
  .maplibregl-popup-content{background:#fff;color:var(--ink);border-radius:16px;padding:0;overflow:hidden;
    border:1px solid var(--line);box-shadow:0 16px 46px rgba(42,35,32,0.22);width:264px;font-family:'Inter'}
  .maplibregl-popup-close-button{color:#fff;font-size:22px;padding:0 9px;right:2px;top:2px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .maplibregl-popup-tip{border-top-color:#fff!important;border-bottom-color:#fff!important}
  .card-img{height:124px;background-size:cover;background-position:center;background-color:#e8ded0;position:relative}
  .card-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,0.35))}
  .card-kind{position:absolute;left:10px;top:10px;z-index:2;font-family:'Inter';font-weight:700;font-size:10.5px;letter-spacing:.04em;
    text-transform:uppercase;color:#fff;padding:4px 9px;border-radius:99px;backdrop-filter:blur(4px)}
  .card-body{padding:12px 14px 14px}
  .card-body h4{font-family:'Fraunces';font-weight:700;font-size:16px;margin-bottom:3px;line-height:1.15}
  .card-meta{font-size:12px;color:var(--muted);margin-bottom:7px}
  .card-rating{color:var(--gold-d);font-weight:700;font-size:12.5px}
  .card-actions{display:flex;gap:7px;margin-top:10px}
  .card-actions a{flex:1;text-align:center;text-decoration:none;font-family:'Inter';font-weight:700;font-size:11.5px;
    padding:8px 6px;border-radius:9px;transition:.15s;border:1px solid transparent}
  .a-detay{background:var(--gold);color:#fff}
  .a-detay:hover{background:var(--gold-d)}
  .a-wa{background:#25D366;color:#fff}
  .a-yol{background:var(--cream);color:var(--ink);border-color:var(--line)}

  .loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:20;
    background:var(--cream);font-family:'Fraunces';font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--gold-d)}
  .spin{width:34px;height:34px;border:3px solid rgba(232,160,32,0.25);border-top-color:var(--gold);border-radius:50%;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:600px){
    .panel{max-width:44vw;padding:11px 12px;left:12px;bottom:12px}
    .filters{top:54px;gap:6px}
    .chip{font-size:11.5px;padding:7px 11px}
    .brand{font-size:15px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="loading" id="loading"><div class="spin"></div>Kalkan 3B harita yükleniyor…</div>

<div class="topbar">
  <a class="brand" href="/">Kalkan<b>Info</b></a>
  <a class="back-link" href="/">← Ana sayfa</a>
</div>

<div class="filters" id="filters"></div>

<div class="panel">
  <h3>Kalkan'ı Keşfet</h3>
  <div class="sub">Gerçek konumlarıyla mekanlar</div>
  <div class="btns">
    <button class="btn active" id="spinBtn">⟲ Döndür</button>
    <button class="btn" id="resetBtn">↺ Merkez</button>
  </div>
  <div class="count" id="count">Yükleniyor…</div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const KALKAN = { center: [29.4130, 36.2650], zoom: 14.2, pitch: 62, bearing: -20 };

// Kategori tanımı (renk + ikon + veri kaynağı)
const CATS = [
  { key:'Restoran', color:'#E8A020', file:'/data/restoranlar.json' },
  { key:'Otel',     color:'#4A9EF5', file:'/data/oteller.json' },
  { key:'Villa',    color:'#8B5CF6', file:'/data/villalar.json' },
  { key:'Plaj',     color:'#2FA6A0', file:'/data/plajlar.json' },
];
const COLOR = Object.fromEntries(CATS.map(c=>[c.key,c.color]));

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      sat: { type:'raster', tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256, maxzoom:19, attribution:'Esri, Maxar' },
      dem: { type:'raster-dem', tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding:'terrarium', tileSize:256, maxzoom:15 }
    },
    layers: [ { id:'sat', type:'raster', source:'sat' } ]
  },
  center: KALKAN.center, zoom: KALKAN.zoom, pitch: KALKAN.pitch, bearing: KALKAN.bearing,
  maxPitch: 80, attributionControl: true
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }), 'top-right');

// otomatik sinematik döndürme
let spinning = true;
function spin(){ if(!spinning) return; map.setBearing(map.getBearing()+0.05); requestAnimationFrame(spin); }
document.getElementById('spinBtn').onclick = (e)=>{ spinning=!spinning; e.currentTarget.classList.toggle('active',spinning); if(spinning) spin(); };
document.getElementById('resetBtn').onclick = ()=>{ spinning=false; document.getElementById('spinBtn').classList.remove('active'); map.flyTo({ ...KALKAN, duration:2200, essential:true }); };

const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
// Villa yaklaşık Kalamar konumları (villalar.json'da koordinat yok; F2'de villacim gerçeğiyle güncellenecek)
const VILLA_COORDS = { 'villa-poyraz':[29.4092,36.2628], 'villa-ship-ahoy':[29.4082,36.2636], 'villa-seascape':[29.4079,36.2639] };
function coordOf(v){
  const c=v.coordinates||v.geo||v.coords;
  if(c&&(c.longitude||c.lng)&&(c.latitude||c.lat)) return [c.longitude||c.lng, c.latitude||c.lat];
  if(v.lng!=null&&v.lat!=null) return [v.lng, v.lat];
  if(v.longitude!=null&&v.latitude!=null) return [v.longitude, v.latitude];
  if(v.id && VILLA_COORDS[v.id]) return VILLA_COORDS[v.id];
  return null;
}
async function loadSet(file, kind){
  try{
    const d = await fetch(file).then(r=>r.json());
    const a = Array.isArray(d)?d:(d.items||d.data||Object.values(d).find(Array.isArray)||[]);
    return a.filter(x=>x&&x.name).map(x=>({...x,_kind:kind}));
  }catch(e){ return []; }
}
function waLink(v){
  const msg = encodeURIComponent(`Merhaba, ${v.name} hakkında bilgi almak istiyorum (kalkaninfo.com haritasından).`);
  return `https://wa.me/905306650794?text=${msg}`;
}
function cardHTML(v){
  const photo = (Array.isArray(v.gallery)&&v.gallery[0]) || v.image || '';
  const rating = v.rating ? `<span class="card-rating">★ ${esc(v.rating)}</span>${v.reviewCount?` <span style="color:#9a8f83">· ${esc(v.reviewCount)} yorum</span>`:''}` : '';
  const c = coordOf(v);
  const yol = c ? `https://www.google.com/maps/dir/?api=1&destination=${c[1]},${c[0]}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.name+' Kalkan')}`;
  const detay = v.detailPath ? `<a class="a-detay" href="${esc(v.detailPath)}" target="_blank" rel="noopener">Detay</a>` : '';
  return `${photo?`<div class="card-img" style="background-image:url('${esc(photo)}')"><span class="card-kind" style="background:${COLOR[v._kind]||'#888'}cc">${esc(v._kind)}</span></div>`
      :`<div class="card-img" style="display:flex;align-items:center;justify-content:center"><span class="card-kind" style="background:${COLOR[v._kind]||'#888'}cc">${esc(v._kind)}</span></div>`}
    <div class="card-body">
      <h4>${esc(v.name)}</h4>
      <div class="card-meta">${esc(v.cuisine||v.category||v._kind)}${v.location?` · ${esc(v.location)}`:''}</div>
      <div>${rating}</div>
      <div class="card-actions">
        ${detay}
        <a class="a-wa" href="${waLink(v)}" target="_blank" rel="noopener">WhatsApp</a>
        <a class="a-yol" href="${yol}" target="_blank" rel="noopener">Yol tarifi</a>
      </div>
    </div>`;
}

// güvenlik: 8sn içinde load olmazsa loading gizle
setTimeout(()=>{ const l=document.getElementById('loading'); if(l) l.style.display='none'; }, 8000);

const markers = []; // {marker, kind}
const active = new Set(CATS.map(c=>c.key)); // hepsi açık

function renderFilters(counts){
  const wrap = document.getElementById('filters');
  wrap.innerHTML = CATS.map(c=>`
    <div class="chip" data-kind="${c.key}">
      <span class="cdot" style="background:${c.color};box-shadow:0 0 8px ${c.color}"></span>
      ${c.key}<span style="color:#9a8f83;font-weight:500"> ${counts[c.key]||0}</span>
    </div>`).join('');
  wrap.querySelectorAll('.chip').forEach(chip=>{
    chip.onclick = ()=>{
      const k = chip.dataset.kind;
      if(active.has(k)){ active.delete(k); chip.classList.add('off'); }
      else { active.add(k); chip.classList.remove('off'); }
      applyFilter();
    };
  });
}
function applyFilter(){
  let vis=0;
  markers.forEach(m=>{
    const on = active.has(m.kind);
    m.marker.getElement().style.display = on ? '' : 'none';
    if(on) vis++;
  });
  document.getElementById('count').textContent = `${vis} mekan görünüyor`;
}

map.on('load', async ()=>{
  document.getElementById('loading').style.display='none';
  try { map.setTerrain({ source:'dem', exaggeration:1.4 }); } catch(e){}
  try { map.setSky({ 'sky-color':'#bcd9ff','sky-horizon-blend':0.55,'horizon-color':'#eaf3ff','horizon-fog-blend':0.55,'fog-color':'#f3ece0','fog-ground-blend':0.35 }); } catch(e){}
  spin();

  const counts = {};
  for(const cat of CATS){
    const items = await loadSet(cat.file, cat.key);
    let n=0;
    for(const v of items){
      const c = coordOf(v); if(!c) continue; n++;
      const el = document.createElement('div');
      el.style.cssText = `width:15px;height:15px;border-radius:50%;cursor:pointer;background:${cat.color};border:2.5px solid #fff;box-shadow:0 0 10px ${cat.color},0 2px 7px rgba(0,0,0,.5);transition:transform .15s`;
      el.onmouseenter=()=>el.style.transform='scale(1.45)'; el.onmouseleave=()=>el.style.transform='scale(1)';
      const marker = new maplibregl.Marker({element:el})
        .setLngLat(c)
        .setPopup(new maplibregl.Popup({offset:18,closeButton:true,maxWidth:'264px'}).setHTML(cardHTML(v)))
        .addTo(map);
      markers.push({marker, kind:cat.key});
    }
    counts[cat.key] = n;
  }
  renderFilters(counts);
  const total = markers.length;
  document.getElementById('count').textContent = `${total} mekan haritada`;

  // sinematik açılış: hafif zoom-in
  map.flyTo({ ...KALKAN, zoom:14.6, duration:3200, essential:true });
});
</script>
</body>
</html>
