<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magazine · Kalkan Nightlife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:'Inter',sans-serif;background:#000;color:#f5e9d0;}

.post{
  position:relative;width:1080px;height:1350px;
  overflow:hidden;
}

/* ========= PHOTO LAYER — swap URL with your nightlife photo ========= */
.photo{
  position:absolute;inset:0;
  background:url('https://placehold.co/1080x1350/1a1410/2a1f17?text=YOUR+NIGHTLIFE+PHOTO') center center/cover no-repeat;
}

/* ========= OVERLAY — transparent design layer ========= */

/* Soft dark gradients ONLY at top + bottom for text legibility */
.legibility{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(6,18,31,0.78) 0%, rgba(6,18,31,0.45) 18%, transparent 32%),
    linear-gradient(0deg,   rgba(6,18,31,0.85) 0%, rgba(6,18,31,0.55) 22%, transparent 40%);
}

/* Gold frame */
.border{
  position:absolute;inset:38px;border:1px solid rgba(232,152,18,0.55);pointer-events:none;
}
.border::before,.border::after{
  content:'';position:absolute;width:16px;height:16px;border:2px solid #e89812;
}
.border::before{top:-9px;left:-9px;border-right:none;border-bottom:none;}
.border::after{bottom:-9px;right:-9px;border-left:none;border-top:none;}

/* Subtle film grain */
.grain{
  position:absolute;inset:0;opacity:0.14;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85'/%3E%3C/filter%3E%3Crect width='400' height='400' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
}

.content{
  position:relative;z-index:10;
  width:100%;height:100%;
  padding:90px 80px 72px;
  display:flex;flex-direction:column;
}

/* MASTHEAD — top strip */
.masthead{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:24px;border-bottom:1px solid rgba(232,152,18,0.45);
}
.masthead-left{display:flex;flex-direction:column;gap:6px;}
.masthead-brand{
  font-family:'Cinzel',serif;
  font-size:22px;letter-spacing:0.55em;font-weight:600;
  color:#e89812;margin-left:0.55em;
  text-shadow:0 2px 12px rgba(0,0,0,0.6);
}
.masthead-tag{
  font-size:10px;letter-spacing:0.42em;text-transform:uppercase;
  color:#dde6ef;font-weight:500;
  text-shadow:0 2px 8px rgba(0,0,0,0.7);
}
.masthead-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.masthead-issue{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;letter-spacing:0.18em;color:#f0c87a;font-weight:500;font-style:italic;
  text-shadow:0 2px 8px rgba(0,0,0,0.7);
}
.masthead-date{
  font-size:10px;letter-spacing:0.42em;text-transform:uppercase;
  color:#dde6ef;font-weight:500;
  text-shadow:0 2px 8px rgba(0,0,0,0.7);
}

/* MIDDLE — empty spacer (photo shows through) */
.middle{flex:1;}

/* BOTTOM PANEL — glass card with title + venues */
.panel{
  display:flex;flex-direction:column;
  gap:32px;
}

.kicker{
  display:inline-flex;align-items:center;gap:16px;
  font-size:13px;letter-spacing:0.48em;text-transform:uppercase;
  color:#e89812;font-weight:700;align-self:flex-start;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}
.kicker::before{
  content:'';width:48px;height:1px;background:#e89812;
}

.title{
  font-family:'Cormorant Garamond',serif;
  font-size:144px;line-height:0.92;font-weight:500;
  color:#f5e9d0;letter-spacing:-0.025em;
  text-shadow:0 4px 24px rgba(0,0,0,0.85), 0 2px 8px rgba(0,0,0,0.7);
}
.title em{font-style:italic;color:#f0c87a;font-weight:500;}

.subtitle{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;line-height:1.32;font-weight:400;
  color:#f0eadf;font-style:italic;max-width:780px;
  text-shadow:0 2px 12px rgba(0,0,0,0.8);
}

/* VENUE STRIP */
.venues{
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
  padding-top:28px;border-top:1px solid rgba(232,152,18,0.4);
}
.venue{display:flex;flex-direction:column;gap:6px;}
.venue-num{
  font-family:'Cormorant Garamond',serif;
  font-size:20px;color:#e89812;font-weight:600;font-style:italic;
  text-shadow:0 2px 6px rgba(0,0,0,0.8);
}
.venue-name{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;line-height:1.08;color:#f5e9d0;font-weight:600;
  text-shadow:0 2px 10px rgba(0,0,0,0.85);
}
.venue-meta{
  font-size:10.5px;letter-spacing:0.32em;text-transform:uppercase;
  color:#cdd7e0;font-weight:500;
  text-shadow:0 2px 6px rgba(0,0,0,0.8);
}

/* FOOTER */
.footer{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:28px;margin-top:22px;
  border-top:1px solid rgba(232,152,18,0.4);
}
.footer-left{display:flex;flex-direction:column;gap:4px;}
.handle{
  font-family:'Inter',sans-serif;
  font-size:20px;letter-spacing:0.14em;color:#f5e9d0;font-weight:600;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}
.handle .at{color:#e89812;font-weight:700;}
.domain{
  font-size:11px;letter-spacing:0.42em;text-transform:uppercase;
  color:#cdd7e0;font-weight:500;
  text-shadow:0 2px 6px rgba(0,0,0,0.8);
}
.footer-cta{
  display:inline-flex;align-items:center;gap:12px;
  padding:14px 26px;
  border:1px solid #e89812;
  background:rgba(6,18,31,0.4);
  backdrop-filter:blur(4px);
  font-size:11px;letter-spacing:0.38em;text-transform:uppercase;
  color:#e89812;font-weight:700;
}
.footer-cta::after{content:'→';font-size:14px;}
</style>
</head>
<body>

<div class="post">
  <!-- PHOTO ZEMIN -->
  <div class="photo"></div>

  <!-- OVERLAY -->
  <div class="legibility"></div>
  <div class="grain"></div>
  <div class="border"></div>

  <div class="content">

    <!-- MASTHEAD -->
    <div class="masthead">
      <div class="masthead-left">
        <div class="masthead-brand">KALKAN INFO</div>
        <div class="masthead-tag">Magazine · Local Guide</div>
      </div>
      <div class="masthead-right">
        <div class="masthead-issue">Issue No. 01</div>
        <div class="masthead-date">June · 2026</div>
      </div>
    </div>

    <!-- MIDDLE (photo shows through) -->
    <div class="middle"></div>

    <!-- PANEL — title + venues + footer -->
    <div class="panel">

      <div class="kicker">Tonight in Kalkan</div>

      <div class="title">
        Night<em>life</em>
      </div>

      <div class="subtitle">
        A cocktail by the sea, a DJ set on the cliffs,<br>
        a dinner under the stars at the harbour.
      </div>

      <div class="footer">
        <div class="footer-left">
          <div class="handle"><span class="at">@</span>kalkaninfo</div>
          <div class="domain">kalkaninfo.com</div>
        </div>
        <div class="footer-cta">Details in Bio</div>
      </div>

    </div>

  </div>
</div>

</body>
</html>
