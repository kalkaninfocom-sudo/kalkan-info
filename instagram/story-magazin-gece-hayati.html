<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story · Magazine · Kalkan Nightlife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;background:#000;color:#f5e9d0;}

.story{
  position:relative;width:1080px;height:1920px;overflow:hidden;
}

/* ========= PHOTO LAYER — swap URL with your nightlife photo ========= */
.photo{
  position:absolute;inset:0;
  background:url('https://placehold.co/1080x1920/1a1410/2a1f17?text=YOUR+NIGHTLIFE+PHOTO') center center/cover no-repeat;
}

/* ========= TRANSPARENT OVERLAY ========= */

/* Top + bottom legibility gradient — middle stays open for photo */
.legibility{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(6,18,31,0.78) 0%, rgba(6,18,31,0.42) 18%, transparent 30%),
    linear-gradient(0deg,   rgba(6,18,31,0.88) 0%, rgba(6,18,31,0.55) 22%, transparent 38%);
}

/* Gold frame */
.border{
  position:absolute;inset:48px;border:1px solid rgba(232,152,18,0.55);pointer-events:none;
}
.border::before,.border::after{
  content:'';position:absolute;width:16px;height:16px;border:2px solid #e89812;
}
.border::before{top:-9px;left:-9px;border-right:none;border-bottom:none;}
.border::after{bottom:-9px;right:-9px;border-left:none;border-top:none;}

/* Grain */
.grain{
  position:absolute;inset:0;opacity:0.12;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85'/%3E%3C/filter%3E%3Crect width='400' height='400' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
}

.content{
  position:relative;z-index:10;
  width:100%;height:100%;
  padding:130px 90px 90px;
  display:flex;flex-direction:column;
}

/* TOP — brand */
.brand{
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.brand-mark{
  font-family:'Cinzel',serif;
  font-size:28px;letter-spacing:0.55em;font-weight:600;
  color:#e89812;margin-left:0.55em;
  text-shadow:0 2px 14px rgba(0,0,0,0.7);
}
.brand-divider{
  width:64px;height:1px;background:#e89812;margin:22px 0 18px;opacity:0.85;
}
.brand-tag{
  font-size:13px;letter-spacing:0.36em;text-transform:uppercase;
  color:#f0eadf;font-weight:500;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

/* MIDDLE — let photo breathe */
.middle{flex:1;}

/* BOTTOM PANEL — title + venue card */
.panel{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:40px;
}

.kicker{
  display:inline-flex;align-items:center;gap:16px;
  font-size:14px;letter-spacing:0.46em;text-transform:uppercase;
  color:#e89812;font-weight:700;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}
.kicker::before,.kicker::after{
  content:'';width:36px;height:1px;background:#e89812;
}

.title-block{display:flex;flex-direction:column;align-items:center;gap:18px;}
.label{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;letter-spacing:0.18em;color:#f0c87a;font-weight:500;
  font-style:italic;text-transform:uppercase;
  text-shadow:0 2px 10px rgba(0,0,0,0.85);
}
.title{
  font-family:'Cormorant Garamond',serif;
  font-size:188px;line-height:0.92;font-weight:500;
  color:#f5e9d0;letter-spacing:-0.025em;
  text-shadow:0 4px 28px rgba(0,0,0,0.9), 0 2px 10px rgba(0,0,0,0.8);
}
.title em{font-style:italic;color:#f0c87a;font-weight:500;}

.subtitle{
  font-family:'Cormorant Garamond',serif;
  font-size:38px;line-height:1.34;font-weight:400;
  color:#f0eadf;font-style:italic;max-width:840px;
  text-shadow:0 2px 14px rgba(0,0,0,0.85);
}
.subtitle .accent{color:#f0c87a;font-style:normal;font-weight:600;}

/* Featured venue glass card */
.venue-card{
  width:100%;max-width:840px;
  background:rgba(6,18,31,0.42);
  border:1px solid rgba(232,152,18,0.5);
  padding:34px 44px;
  display:flex;flex-direction:column;gap:12px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.venue-card-label{
  font-size:11px;letter-spacing:0.46em;text-transform:uppercase;
  color:#e89812;font-weight:700;
}
.venue-card-name{
  font-family:'Cormorant Garamond',serif;
  font-size:48px;line-height:1.05;color:#f5e9d0;font-weight:600;
}
.venue-card-meta{
  display:flex;gap:28px;margin-top:6px;justify-content:center;
  font-size:13px;letter-spacing:0.18em;text-transform:uppercase;
  color:#cdd7e0;font-weight:500;
}
.venue-card-meta strong{color:#f0c87a;font-weight:600;}

/* Footer */
.footer{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding-bottom:8px;
}
.cta{
  display:inline-flex;align-items:center;gap:18px;
  padding:22px 50px;
  background:#e89812;color:#072136;
  font-size:18px;letter-spacing:0.32em;text-transform:uppercase;font-weight:700;
  border:1px solid #e89812;
}
.handle{
  font-family:'Inter',sans-serif;
  font-size:22px;letter-spacing:0.16em;color:#f5e9d0;font-weight:600;
  text-shadow:0 2px 10px rgba(0,0,0,0.8);
}
.handle .at{color:#e89812;font-weight:700;}
.domain{
  font-size:13px;letter-spacing:0.42em;text-transform:uppercase;
  color:#cdd7e0;font-weight:500;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div class="story">
  <!-- PHOTO ZEMIN -->
  <div class="photo"></div>

  <!-- OVERLAY -->
  <div class="legibility"></div>
  <div class="grain"></div>
  <div class="border"></div>

  <div class="content">

    <!-- BRAND -->
    <div class="brand">
      <div class="brand-mark">KALKAN INFO</div>
      <div class="brand-divider"></div>
      <div class="brand-tag">Magazine · Local Guide</div>
    </div>

    <!-- MIDDLE (photo shows through) -->
    <div class="middle"></div>

    <!-- PANEL -->
    <div class="panel">

      <div class="kicker">Tonight in Kalkan</div>

      <div class="title-block">
        <div class="label">Magazine · Issue 01</div>
        <div class="title">Night<em>life</em></div>
      </div>

      <div class="subtitle">
        A cocktail by the sea, a DJ set on the cliffs,<br>
        an evening <span class="accent">under the stars</span> at the harbour.
      </div>

      <div class="venue-card">
        <div class="venue-card-label">Tonight's Venue</div>
        <div class="venue-card-name">Moonlight Beach Club</div>
        <div class="venue-card-meta">
          <span><strong>Seaside</strong> · Kalamar Bay</span>
          <span><strong>22:00</strong> — 03:00</span>
        </div>
      </div>

      <div class="footer">
        <div class="cta">Swipe · Details</div>
        <div class="handle"><span class="at">@</span>kalkaninfo</div>
        <div class="domain">kalkaninfo.com</div>
      </div>

    </div>

  </div>
</div>

</body>
</html>
