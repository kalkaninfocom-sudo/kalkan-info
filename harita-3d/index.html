<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Kalkan 3B Canlı Harita — Dijital İkiz | Kalkan Info</title>
<meta name="description" content="Kalkan'ın foto-gerçekçi 3B haritası: her mekanın konumu, anlık açık/kapalı durumu, doluluk tahmini, web sitesi ve görselleri tek ekranda." />
<link rel="canonical" href="https://kalkaninfo.com/harita-3d" />
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/cesium@1.114.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
<style>
  :root{
    --sea-900:#04121f; --sea-800:#072136; --sea-700:#0d3a5f; --sea-600:#0c5a8a;
    --sun:#e89812; --sun-l:#f4b53d; --teal:#0ea5a4; --purple:#8b5cf6; --blue:#3b82f6; --rose:#d4327a; --red:#ef4444;
    --green:#4ade80;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--sea-900);color:#fff;overflow:hidden;}
  #cesium{position:absolute;inset:0;}
  .cesium-widget-credits,.cesium-viewer-bottom{display:none!important;}
  .font-d{font-family:'Montserrat',system-ui,sans-serif;letter-spacing:-0.02em;}

  /* Top bar */
  #topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;
    padding:12px 16px;background:linear-gradient(180deg,rgba(4,18,31,.92) 0%,rgba(4,18,31,.55) 70%,transparent 100%);pointer-events:none;}
  #topbar > *{pointer-events:auto;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;text-decoration:none;color:#fff;white-space:nowrap;}
  .brand .dot{color:var(--sun);}
  .title-chip{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--sun-l);
    background:rgba(232,152,18,.12);border:1px solid rgba(232,152,18,.35);border-radius:999px;padding:4px 10px;}
  #filters{display:flex;gap:6px;overflow-x:auto;margin-left:auto;max-width:60vw;scrollbar-width:none;}
  #filters::-webkit-scrollbar{display:none;}
  .chip{font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border-radius:999px;padding:6px 12px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;transition:transform .15s,background .15s,border-color .15s;}
  .chip:hover{background:rgba(255,255,255,.16);}
  .chip.active{background:var(--sun);border-color:var(--sun);color:#0a1a2b;font-weight:700;}
  .chip:focus-visible{outline:2px solid var(--sun-l);outline-offset:2px;}

  /* Legend / status */
  #status{position:absolute;left:16px;bottom:16px;z-index:15;font-size:12px;color:#cfe0ee;
    background:rgba(4,18,31,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px);max-width:260px;}
  #status b{color:#fff;}
  .mode-pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;}
  .mode-pill .d{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
  .mode-pill.fallback .d{background:var(--sun);box-shadow:0 0 8px var(--sun);}

  /* Key banner */
  #keybanner{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:18;max-width:min(680px,92vw);
    background:rgba(232,152,18,.12);border:1px solid rgba(232,152,18,.4);color:#ffe9c2;border-radius:12px;
    padding:10px 14px;font-size:13px;line-height:1.5;backdrop-filter:blur(6px);display:none;}
  #keybanner code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px;color:#fff;}

  /* Side panel */
  #panel{position:absolute;top:0;right:0;z-index:25;height:100%;width:380px;max-width:92vw;transform:translateX(105%);
    transition:transform .32s cubic-bezier(.22,1,.36,1);background:linear-gradient(180deg,var(--sea-800),var(--sea-900));
    border-left:1px solid rgba(255,255,255,.08);box-shadow:-20px 0 60px -20px rgba(0,0,0,.8);display:flex;flex-direction:column;}
  #panel.open{transform:translateX(0);}
  .p-hero{position:relative;height:200px;background:#0a2338;overflow:hidden;flex-shrink:0;}
  .p-hero img{width:100%;height:100%;object-fit:cover;display:block;}
  .p-hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,18,31,.1) 0%,rgba(4,18,31,.85) 100%);}
  .p-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(4,18,31,.6);color:#fff;font-size:18px;display:grid;place-items:center;backdrop-filter:blur(4px);}
  .p-close:hover{background:rgba(4,18,31,.9);}
  .p-cat{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    padding:5px 10px;border-radius:999px;color:#fff;}
  .p-body{padding:18px 20px;overflow-y:auto;flex:1;}
  .p-name{font-size:22px;font-weight:800;line-height:1.15;margin:0 0 6px;}
  .p-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#a9c2d6;margin-bottom:14px;}
  .stars{color:var(--sun-l);font-weight:700;}
  .open-badge{font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;}
  .open-badge.open{color:var(--green);background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3);}
  .open-badge.closed{color:#ff8f8f;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);}

  .occ{margin:6px 0 18px;}
  .occ-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .occ-label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#8fb0c8;}
  .occ-val{font-weight:800;font-size:14px;}
  .occ-bar{height:9px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;}
  .occ-fill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1);}
  .occ-fill.high{background:linear-gradient(90deg,#f97316,#ef4444);}
  .occ-fill.mid{background:linear-gradient(90deg,#e8a020,#f4b53d);}
  .occ-fill.low{background:linear-gradient(90deg,#0ea5a4,#4ade80);}
  .occ-note{font-size:11px;color:#6f8ba3;margin-top:5px;}

  .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#7f9db4;margin:18px 0 8px;font-weight:700;}
  .post{display:flex;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px;}
  .post img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#0a2338;}
  .post .cap{font-size:12.5px;color:#cfe0ee;line-height:1.45;}
  .post .cap .h{color:var(--sun-l);font-weight:600;}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#0a2338;}
  .p-actions{display:flex;gap:8px;padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0;}
  .btn{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13px;border-radius:10px;padding:11px 10px;
    transition:transform .15s,filter .15s;cursor:pointer;border:none;}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.08);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg,var(--sun),#c97b09);color:#fff;}
  .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);}

  #loading{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:var(--sea-900);transition:opacity .5s;}
  #loading .l{text-align:center;}
  #loading .spin{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--sun);border-radius:50%;
    margin:0 auto 14px;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media(max-width:640px){
    #panel{width:100%;}
    #filters{max-width:100%;}
    .title-chip{display:none;}
  }
</style>
</head>
<body>
<div id="cesium"></div>

<div id="topbar">
  <a class="brand font-d" href="/index.html"><span class="dot">◆</span> KALKAN <span class="dot">INFO</span></a>
  <span class="title-chip">3B Canlı Harita · beta</span>
  <div id="filters" role="tablist" aria-label="Kategori filtresi"></div>
</div>

<div id="keybanner"></div>

<div id="status">
  <div class="mode-pill" id="mode"><span class="d"></span><span id="mode-text">3B yükleniyor…</span></div>
  <div style="margin-top:6px;"><b id="venue-count">0</b> mekan · <b id="open-count">0</b> şu an açık</div>
  <div style="margin-top:4px;color:#7f9db4;font-size:11px;">Pin'e tıkla → mekan detayı, doluluk tahmini, görsel</div>
</div>

<aside id="panel" aria-hidden="true">
  <div class="p-hero">
    <img id="p-img" alt="" />
    <div class="grad"></div>
    <span class="p-cat" id="p-cat"></span>
    <button class="p-close" id="p-close" aria-label="Kapat">×</button>
  </div>
  <div class="p-body">
    <h2 class="p-name" id="p-name"></h2>
    <div class="p-meta" id="p-meta"></div>

    <div class="occ">
      <div class="occ-top">
        <span class="occ-label">Doluluk (tahmini)</span>
        <span class="occ-val" id="occ-val"></span>
      </div>
      <div class="occ-bar"><div class="occ-fill" id="occ-fill" style="width:0%"></div></div>
      <div class="occ-note">Anlık açık/kapalı, saat, puan ve yorum sayısından türetilmiş tahmindir — kesin değildir.</div>
    </div>

    <div class="sec-title">Son paylaşım</div>
    <div class="post" id="p-post">
      <img id="p-post-img" alt="" />
      <div class="cap" id="p-post-cap"></div>
    </div>

    <div class="sec-title" id="gal-title" style="display:none;">Galeri</div>
    <div class="gallery" id="p-gallery"></div>
  </div>
  <div class="p-actions">
    <a class="btn primary" id="p-web" target="_blank" rel="noopener">Web sitesi</a>
    <a class="btn ghost" id="p-dir" target="_blank" rel="noopener">Yol tarifi</a>
  </div>
</aside>

<div id="loading"><div class="l"><div class="spin"></div><div class="font-d" style="font-weight:700;">Kalkan 3B yükleniyor…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/cesium@1.114.0/Build/Cesium/Cesium.js"></script>
<script>
window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.114.0/Build/Cesium/';
(async function(){
  // ── Google Maps Tiles key: ?key= URL param, ya da window.KALKAN_MAPS_KEY (config), yoksa fallback ──
  const KEY = new URLSearchParams(location.search).get('key') || (window.KALKAN_MAPS_KEY || '').trim();
  const CENTER = { lat: 36.2626, lng: 29.4143 };

  Cesium.Ion.defaultAccessToken = ''; // Ion varlıklarını kullanmıyoruz (OSM + Google 3D Tiles keyless-of-Ion)

  const viewer = new Cesium.Viewer('cesium', {
    baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' })),
    baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, timeline: false, animation: false, fullscreenButton: false,
    infoBox: false, selectionIndicator: false, requestRenderMode: true,
  });
  viewer.scene.globe.enableLighting = false;
  viewer.scene.skyAtmosphere.show = true;

  // ── Foto-gerçekçi 3B (Google) veya fallback ──
  const modeEl = document.getElementById('mode');
  const modeText = document.getElementById('mode-text');
  let photoreal = false;
  if (KEY) {
    try {
      let tileset;
      try { tileset = await Cesium.createGooglePhotorealistic3DTileset(KEY); }
      catch { tileset = await Cesium.createGooglePhotorealistic3DTileset({ key: KEY }); }
      viewer.scene.primitives.add(tileset);
      viewer.scene.globe.show = false; // 3B tiles zemini kaplar
      photoreal = true;
      modeText.textContent = 'Foto-gerçekçi 3B · Google';
    } catch (e) {
      console.warn('Google 3D Tiles yüklenemedi:', e.message);
    }
  }
  if (!photoreal) {
    modeEl.classList.add('fallback');
    modeText.textContent = 'Harita modu (3B için Google key ekle)';
    const b = document.getElementById('keybanner');
    b.style.display = 'block';
    b.innerHTML = 'Foto-gerçekçi 3B için <b>Google Maps Tiles API</b> anahtarı gerekli. '
      + 'Ekle: <code>.env.local → GOOGLE_MAPS_API_KEY</code> veya test için URL\'ye <code>?key=ANAHTAR</code>. '
      + 'Şimdilik harita + tüm mekan verisi/doluluk aşağıda çalışıyor.';
  }

  // Kamera: Kalkan'a eğik bak (3B his)
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(CENTER.lng, CENTER.lat - 0.004, photoreal ? 900 : 3800),
    orientation: { heading: Cesium.Math.toRadians(20), pitch: Cesium.Math.toRadians(photoreal ? -35 : -55), roll: 0 },
    duration: 0,
  });

  // ── Doluluk tahmini (dürüst heuristik) ──
  function estimateOccupancy(v){
    if (!v.isOpen) return { pct: 0, label: 'Kapalı', cls: 'low' };
    const h = new Date().getHours();
    const peaks = { restaurant:[13,20,21], cafe:[10,11,16], bar:[22,23,0], beach_club:[12,13,15], barber:[11,17,18] };
    const pk = peaks[v.category] || [20,21];
    const dist = Math.min.apply(null, pk.map(p => { const d = Math.abs(h - p); return Math.min(d, 24 - d); }));
    let base = Math.max(12, 92 - dist * 17);
    if (v.rating >= 4.6) base += 8; else if (v.rating >= 4.2) base += 3;
    if ((v.reviewCount || 0) > 400) base += 6; else if ((v.reviewCount || 0) > 150) base += 3;
    base = Math.max(6, Math.min(97, Math.round(base)));
    const label = base > 75 ? 'Çok yoğun' : base > 52 ? 'Yoğun' : base > 30 ? 'Orta' : 'Sakin';
    const cls = base > 75 ? 'high' : base > 52 ? 'mid' : 'low';
    return { pct: base, label, cls };
  }

  // ── Veri ──
  const data = await fetch('/data/harita-mekanlar.json', { cache: 'no-cache' }).then(r => r.json());
  const venues = data.venues || [];
  const entityByCat = {};
  let openNow = 0;

  for (const v of venues) {
    if (v.isOpen) openNow++;
    const occ = estimateOccupancy(v);
    const ent = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(v.lng, v.lat, photoreal ? 8 : 0),
      point: {
        pixelSize: 12,
        color: Cesium.Color.fromCssColorString(v.color),
        outlineColor: v.isOpen ? Cesium.Color.fromCssColorString('#4ade80') : Cesium.Color.fromCssColorString('#04121f'),
        outlineWidth: v.isOpen ? 3 : 1.5,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
        scaleByDistance: new Cesium.NearFarScalar(300, 1.6, 6000, 0.7),
      },
      label: {
        text: v.icon,
        font: '15px sans-serif',
        verticalOrigin: Cesium.VerticalOrigin.CENTER,
        pixelOffset: new Cesium.Cartesian2(0, 0),
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
        scaleByDistance: new Cesium.NearFarScalar(300, 1.1, 6000, 0.55),
        show: true,
      },
      _venue: v, _occ: occ,
    });
    (entityByCat[v.category] = entityByCat[v.category] || []).push(ent);
  }

  document.getElementById('venue-count').textContent = venues.length;
  document.getElementById('open-count').textContent = openNow;

  // ── Filtre çipleri ──
  const cats = data.meta?.categories || {};
  const filters = document.getElementById('filters');
  function makeChip(key, label, active){
    const c = document.createElement('button');
    c.className = 'chip' + (active ? ' active' : '');
    c.textContent = label;
    c.setAttribute('role', 'tab');
    c.onclick = () => {
      document.querySelectorAll('#filters .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      Object.entries(entityByCat).forEach(([cat, ents]) => {
        const on = key === 'all' || key === cat;
        ents.forEach(e => e.show = on);
      });
      viewer.scene.requestRender();
    };
    filters.appendChild(c);
  }
  makeChip('all', 'Tümü', true);
  Object.entries(cats).forEach(([k, m]) => makeChip(k, (m.icon || '') + ' ' + (m.label || k)));

  // ── Panel ──
  const panel = document.getElementById('panel');
  const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));
  function stars(r){ if(!r) return ''; const f=Math.round(r); return '★'.repeat(f)+'☆'.repeat(Math.max(0,5-f)); }

  function openPanel(v, occ){
    document.getElementById('p-name').textContent = v.name;
    const cat = document.getElementById('p-cat');
    cat.textContent = (v.icon||'') + ' ' + v.catLabel;
    cat.style.background = v.color;
    const img = document.getElementById('p-img');
    img.src = v.thumbnail || v.gallery[0] || '';
    img.style.display = img.src ? 'block' : 'none';

    const meta = [];
    if (v.rating) meta.push(`<span class="stars">${stars(v.rating)}</span> ${v.rating}${v.reviewCount?` <span style="opacity:.6">(${v.reviewCount})</span>`:''}`);
    meta.push(v.isOpen
      ? `<span class="open-badge open">Açık${v.closesAt?` · ${v.closesAt}'e kadar`:''}</span>`
      : `<span class="open-badge closed">Kapalı</span>`);
    if (v.priceLevel) meta.push('<span style="opacity:.7">'+esc(v.priceLevel)+'</span>');
    document.getElementById('p-meta').innerHTML = meta.join('');

    document.getElementById('occ-val').textContent = occ.pct + '%  ·  ' + occ.label;
    const fill = document.getElementById('occ-fill');
    fill.className = 'occ-fill ' + occ.cls;
    fill.style.width = '0%';
    requestAnimationFrame(() => { setTimeout(() => fill.style.width = occ.pct + '%', 60); });

    // Son paylaşım (MVP: son görsel + özet; IG bağlanınca canlı post)
    const postImg = document.getElementById('p-post-img');
    postImg.src = v.thumbnail || v.gallery[0] || '';
    const handle = v.instagram ? '@'+String(v.instagram).replace(/^@|.*instagram\.com\//,'').replace(/\/$/,'') : '';
    document.getElementById('p-post-cap').innerHTML =
      (handle ? `<span class="h">${esc(handle)}</span><br>` : '') +
      (v.summary ? esc(v.summary).slice(0,120) : 'Son paylaşım yakında canlı bağlanacak — mekanın güncel görseli.');

    // Galeri
    const gal = document.getElementById('p-gallery');
    const gt = document.getElementById('gal-title');
    gal.innerHTML = '';
    const imgs = (v.gallery||[]).slice(0,6);
    if (imgs.length > 1) {
      gt.style.display = 'block';
      imgs.forEach(src => { const el = document.createElement('img'); el.src = src; el.loading='lazy'; gal.appendChild(el); });
    } else { gt.style.display = 'none'; }

    const web = document.getElementById('p-web');
    if (v.website || v.detailUrl) { web.href = v.website || v.detailUrl; web.style.display='block'; }
    else web.style.display = 'none';
    document.getElementById('p-dir').href = `https://www.google.com/maps/dir/?api=1&destination=${v.lat},${v.lng}${v.placeId?`&destination_place_id=${v.placeId}`:''}`;

    panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
  }
  document.getElementById('p-close').onclick = () => { panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); };

  // ── Tıklama ──
  const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  handler.setInputAction((click) => {
    const picked = viewer.scene.pick(click.position);
    if (picked && picked.id && picked.id._venue) {
      const v = picked.id._venue, occ = picked.id._occ;
      openPanel(v, occ);
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(v.lng, v.lat - 0.0018, photoreal ? 350 : 1600),
        orientation: { heading: Cesium.Math.toRadians(20), pitch: Cesium.Math.toRadians(photoreal ? -30 : -55) },
        duration: 1.1,
      });
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  // Yükleme ekranını kapat
  const loading = document.getElementById('loading');
  loading.style.opacity = '0';
  setTimeout(() => loading.remove(), 600);
  viewer.scene.requestRender();
})();
</script>
</body>
</html>
