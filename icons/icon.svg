<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a5e93"/>
      <stop offset="60%" stop-color="#0a2e4c"/>
      <stop offset="100%" stop-color="#072136"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f4b53d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f4b53d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#glow)"/>
  <!-- Wave (sea) -->
  <path d="M 0 380 Q 128 340 256 360 T 512 360 L 512 512 L 0 512 Z" fill="#1a5e93" opacity="0.5"/>
  <path d="M 0 410 Q 128 380 256 400 T 512 400 L 512 512 L 0 512 Z" fill="#2477b5" opacity="0.6"/>
  <!-- Big K letter -->
  <text x="256" y="290"
        font-family="Montserrat, Arial, sans-serif"
        font-weight="900"
        font-size="280"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-12">K</text>
  <!-- Sun accent -->
  <circle cx="380" cy="120" r="36" fill="#f4b53d"/>
  <circle cx="380" cy="120" r="36" fill="#f4b53d" opacity="0.5" stroke="#f4b53d" stroke-width="14"/>
</svg>
