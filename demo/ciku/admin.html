<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<base href="/demo/ciku/">
<title>Çiku · Yönetim Paneli</title>
<link rel="icon" type="image/png" href="img/favicon.png" />
<script src="catalog.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config={theme:{extend:{
    colors:{cocoa:{950:'#150b06',900:'#1f120a',800:'#2c1a0f',700:'#3b2417',600:'#4f3220'},cream:{50:'#fbf7f1',100:'#f6ede1',200:'#efe0cd',300:'#e4cdb0'},gold:{400:'#e6b95c',500:'#d4a017',600:'#b9881c'},pist:{500:'#8da750'}},
    fontFamily:{display:['Fraunces','serif'],sans:['Manrope','sans-serif']}
  }}}
</script>
<style>
  body{background:#150b06}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  input,select{color-scheme:dark}
</style>
</head>
<body class="font-sans text-cream-100 antialiased min-h-screen">

<!-- LOGIN GATE -->
<div id="gate" class="fixed inset-0 z-50 grid place-items-center bg-cocoa-950 px-6">
  <div class="w-full max-w-sm rounded-3xl bg-cocoa-800/60 border border-cream-300/10 p-8 text-center">
    <img src="img/logo.png" alt="Çiku" class="h-16 w-auto mx-auto mb-5" />
    <h1 class="font-display text-2xl font-semibold">Yönetim Paneli</h1>
    <p class="text-cream-200/60 text-sm mt-2 mb-6">Devam etmek için şifre girin.</p>
    <input id="pass" type="password" placeholder="Şifre" class="w-full rounded-full bg-cocoa-950/60 border border-cream-300/15 px-5 py-3 text-center focus:outline-none focus:border-gold-400 mb-3" />
    <button id="login" class="w-full rounded-full bg-gradient-to-r from-gold-400 to-gold-600 text-cocoa-900 font-bold py-3 hover:brightness-110 transition">Giriş Yap</button>
    <p id="login-err" class="hidden text-red-400 text-sm mt-3">Hatalı şifre.</p>
    <p class="text-cream-200/30 text-xs mt-5">Demo paneli · şifre: <b>ciku2026</b></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="sticky top-0 z-20 backdrop-blur-xl bg-cocoa-950/80 border-b border-cream-300/10">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img src="img/logo.png" alt="Çiku" class="h-10 w-auto" />
        <span class="font-display text-lg font-semibold hidden sm:inline">Yönetim Paneli</span>
      </div>
      <div class="flex items-center gap-2">
        <a href="./" target="_blank" class="text-sm font-semibold text-cream-200 hover:text-gold-400 px-3 py-2 rounded-lg hover:bg-cream-100/5 transition">↗ Siteyi Gör</a>
        <button id="reset" class="text-sm font-semibold text-red-300/80 hover:text-red-300 px-3 py-2 rounded-lg hover:bg-red-500/10 transition">Sıfırla</button>
        <button id="logout" class="text-sm font-semibold text-cream-200 hover:text-gold-400 px-3 py-2 rounded-lg hover:bg-cream-100/5 transition">Çıkış</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <!-- stats + add -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="font-display text-3xl font-semibold tracking-tight">Ürünler</h2>
        <p class="text-cream-200/60 text-sm mt-1"><span id="stat-count">0</span> ürün · değişiklikler bu tarayıcıda saklanır</p>
      </div>
      <button id="add-btn" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-gold-400 to-gold-600 text-cocoa-900 font-bold px-6 py-3 hover:brightness-110 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        Yeni Ürün
      </button>
    </div>

    <!-- filter -->
    <div class="flex flex-wrap gap-3 mb-5">
      <input id="search" placeholder="Ürün ara…" class="flex-1 min-w-[200px] rounded-full bg-cocoa-800/60 border border-cream-300/15 px-5 py-2.5 text-sm focus:outline-none focus:border-gold-400" />
      <select id="cat-filter" class="rounded-full bg-cocoa-800/60 border border-cream-300/15 px-5 py-2.5 text-sm focus:outline-none focus:border-gold-400"></select>
    </div>

    <!-- table -->
    <div class="rounded-2xl border border-cream-300/10 overflow-hidden">
      <div id="rows"></div>
      <div id="empty" class="hidden text-center py-16 text-cream-200/40">Ürün yok.</div>
    </div>
  </main>
</div>

<!-- EDIT/ADD MODAL -->
<div id="modal" class="hidden fixed inset-0 z-40 grid place-items-center bg-cocoa-950/80 backdrop-blur-sm px-6 py-10 overflow-y-auto">
  <div class="w-full max-w-lg rounded-3xl bg-cocoa-900 border border-cream-300/10 p-7 my-auto">
    <div class="flex items-center justify-between mb-5">
      <h3 id="modal-title" class="font-display text-2xl font-semibold">Yeni Ürün</h3>
      <button id="modal-close" class="w-9 h-9 grid place-items-center rounded-full hover:bg-cream-100/10 text-2xl leading-none">×</button>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-sm text-cream-200/70 block mb-1.5">Ürün adı</label>
        <input id="f-name" class="w-full rounded-xl bg-cocoa-950/60 border border-cream-300/15 px-4 py-2.5 focus:outline-none focus:border-gold-400" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-cream-200/70 block mb-1.5">Fiyat (₺)</label>
          <input id="f-price" placeholder="örn. 104,18" class="w-full rounded-xl bg-cocoa-950/60 border border-cream-300/15 px-4 py-2.5 focus:outline-none focus:border-gold-400" />
        </div>
        <div>
          <label class="text-sm text-cream-200/70 block mb-1.5">Kategori</label>
          <select id="f-cat" class="w-full rounded-xl bg-cocoa-950/60 border border-cream-300/15 px-4 py-2.5 focus:outline-none focus:border-gold-400"></select>
        </div>
      </div>
      <div>
        <label class="text-sm text-cream-200/70 block mb-1.5">Etiket (opsiyonel)</label>
        <select id="f-tag" class="w-full rounded-xl bg-cocoa-950/60 border border-cream-300/15 px-4 py-2.5 focus:outline-none focus:border-gold-400">
          <option value="">Yok</option>
          <option value="YENİ">YENİ</option>
          <option value="ÇOK SATAN">ÇOK SATAN</option>
          <option value="HEDİYE">HEDİYE</option>
          <option value="SPESIYAL">SPESIYAL</option>
        </select>
      </div>
      <div>
        <label class="text-sm text-cream-200/70 block mb-1.5">Görsel</label>
        <div class="flex items-center gap-3">
          <div id="f-preview" class="w-20 h-20 rounded-xl bg-cream-50 overflow-hidden shrink-0 grid place-items-center text-cocoa-900/30 text-3xl">🍫</div>
          <div class="flex-1 space-y-2">
            <input id="f-img" placeholder="Görsel URL veya img/..." class="w-full rounded-xl bg-cocoa-950/60 border border-cream-300/15 px-4 py-2.5 text-sm focus:outline-none focus:border-gold-400" />
            <label class="inline-flex items-center gap-2 text-sm text-gold-400 cursor-pointer hover:text-gold-500">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 4v12m0-12l-4 4m4-4l4 4"/></svg>
              Bilgisayardan yükle
              <input id="f-file" type="file" accept="image/*" class="hidden" />
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="flex gap-3 mt-7">
      <button id="modal-save" class="flex-1 rounded-full bg-gradient-to-r from-gold-400 to-gold-600 text-cocoa-900 font-bold py-3 hover:brightness-110 transition">Kaydet</button>
      <button id="modal-cancel" class="rounded-full border border-cream-300/20 px-6 py-3 font-semibold hover:bg-cream-100/5 transition">İptal</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-pist-500 text-cocoa-900 font-bold px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity"></div>

<script>
const PASS='ciku2026';
const CATS=["Çikolatalar","Şekerlemeler","Unlu Mamüller","İçecekler","Sağlıklı Yaşam","İthal Ürünler","Fırsatlar"];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULTS=()=> (window.CIKU_CATALOG||[]).map(p=>({...p}));

function load(){
  try{const s=localStorage.getItem('ciku_products'); if(s){const a=JSON.parse(s); if(Array.isArray(a))return a;}}catch(e){}
  return DEFAULTS();
}
function save(list){ localStorage.setItem('ciku_products', JSON.stringify(list)); }
let DATA=load();
let editIndex=-1;

/* ---- auth ---- */
function showApp(){ document.getElementById('gate').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); init(); }
if(sessionStorage.getItem('ciku_admin')==='1') showApp();
document.getElementById('login').addEventListener('click',tryLogin);
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
function tryLogin(){
  if(document.getElementById('pass').value===PASS){ sessionStorage.setItem('ciku_admin','1'); showApp(); }
  else document.getElementById('login-err').classList.remove('hidden');
}
document.getElementById('logout').addEventListener('click',()=>{ sessionStorage.removeItem('ciku_admin'); location.reload(); });
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('Tüm değişiklikler silinip orijinal katalog (205 ürün) geri yüklenecek. Emin misiniz?')){
    localStorage.removeItem('ciku_products'); DATA=load(); render(); toast('Katalog sıfırlandı');
  }
});

/* ---- init ---- */
function init(){
  // category selects
  const ff=document.getElementById('cat-filter');
  ff.innerHTML='<option value="">Tüm kategoriler</option>'+CATS.map(c=>`<option>${esc(c)}</option>`).join('');
  document.getElementById('f-cat').innerHTML=CATS.map(c=>`<option>${esc(c)}</option>`).join('');
  document.getElementById('search').addEventListener('input',render);
  ff.addEventListener('change',render);
  render();
}

/* ---- render table ---- */
function getView(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  const c=document.getElementById('cat-filter').value;
  return DATA.map((p,idx)=>({p,idx})).filter(({p})=>{
    if(c&&p.cat!==c)return false;
    if(q&&!(p.n||'').toLowerCase().includes(q))return false;
    return true;
  });
}
function render(){
  DATA=load();
  document.getElementById('stat-count').textContent=DATA.length;
  const view=getView();
  const rows=document.getElementById('rows');
  const empty=document.getElementById('empty');
  if(!view.length){ rows.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  rows.innerHTML=view.map(({p,idx})=>`
    <div class="flex items-center gap-4 px-4 py-3 border-b border-cream-300/8 hover:bg-cream-100/[.03] transition">
      <div class="w-14 h-14 rounded-xl bg-cream-50 overflow-hidden shrink-0"><img src="${esc(p.img)}" alt="" class="w-full h-full object-contain p-1" onerror="this.style.opacity=.2"></div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm leading-tight line-clamp-2">${esc(p.n)}</div>
        <div class="text-xs text-cream-200/50 mt-0.5">${esc(p.cat||'—')}${p.tag?` · <span class="text-gold-400">${esc(p.tag)}</span>`:''}</div>
      </div>
      <div class="font-display font-semibold text-gold-400 shrink-0 w-24 text-right">${esc(p.p)} ₺</div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button data-edit="${idx}" class="w-9 h-9 grid place-items-center rounded-lg bg-cocoa-800/60 hover:bg-gold-500/20 hover:text-gold-400 transition" title="Düzenle">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        </button>
        <button data-del="${idx}" class="w-9 h-9 grid place-items-center rounded-lg bg-cocoa-800/60 hover:bg-red-500/20 hover:text-red-400 transition" title="Sil">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>
    </div>`).join('');
  rows.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openModal(+b.dataset.edit)));
  rows.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>del(+b.dataset.del)));
}
function del(i){
  const p=DATA[i]; if(!p)return;
  if(confirm(`"${p.n}" ürünü silinsin mi?`)){ DATA.splice(i,1); save(DATA); render(); toast('Ürün silindi'); }
}

/* ---- modal ---- */
const modal=document.getElementById('modal');
function openModal(i){
  editIndex=(typeof i==='number')?i:-1;
  const p=editIndex>=0?DATA[editIndex]:{n:'',p:'',cat:CATS[0],tag:'',img:''};
  document.getElementById('modal-title').textContent=editIndex>=0?'Ürünü Düzenle':'Yeni Ürün';
  document.getElementById('f-name').value=p.n||'';
  document.getElementById('f-price').value=p.p||'';
  document.getElementById('f-cat').value=p.cat||CATS[0];
  document.getElementById('f-tag').value=p.tag||'';
  document.getElementById('f-img').value=p.img||'';
  setPreview(p.img);
  modal.classList.remove('hidden');
}
function closeModal(){ modal.classList.add('hidden'); editIndex=-1; }
function setPreview(src){
  const el=document.getElementById('f-preview');
  if(src){ el.innerHTML=`<img src="${esc(src)}" class="w-full h-full object-contain p-1" onerror="this.parentNode.textContent='🍫'">`; }
  else el.textContent='🍫';
}
document.getElementById('add-btn').addEventListener('click',()=>openModal(-1));
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('modal-cancel').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{ if(e.target===modal)closeModal(); });
document.getElementById('f-img').addEventListener('input',e=>setPreview(e.target.value));
document.getElementById('f-file').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  if(file.size>1.5*1024*1024){ toast('Görsel 1.5MB altında olmalı','err'); return; }
  const r=new FileReader();
  r.onload=()=>{ document.getElementById('f-img').value=r.result; setPreview(r.result); };
  r.readAsDataURL(file);
});
document.getElementById('modal-save').addEventListener('click',()=>{
  const n=document.getElementById('f-name').value.trim();
  const price=document.getElementById('f-price').value.trim();
  if(!n){ toast('Ürün adı gerekli','err'); return; }
  const obj={ n, p:price||'0,00', cat:document.getElementById('f-cat').value, tag:document.getElementById('f-tag').value, img:document.getElementById('f-img').value.trim()||'img/logo.png' };
  if(editIndex>=0) DATA[editIndex]=obj; else DATA.unshift(obj);
  save(DATA); render(); closeModal(); toast(editIndex>=0?'Ürün güncellendi':'Ürün eklendi');
});

/* ---- toast ---- */
let toastT;
function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-50 font-bold px-6 py-3 rounded-full shadow-2xl transition-opacity opacity-100 '+(type==='err'?'bg-red-500 text-white':'bg-pist-500 text-cocoa-900');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.replace('opacity-100','opacity-0'),2200);
}
</script>
</body>
</html>
