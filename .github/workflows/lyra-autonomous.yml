name: Lyra Otonom — Bulut Claude

# Lyra (sesli asistan) bir görev tetiklediğinde bulutta Claude Code çalışır,
# değişikliği yapar, main'e commit eder (Vercel otomatik deploy), Telegram'a bildirir.
# PC KAPALI olsa da çalışır — GitHub bulut runner'ında.
#
# Tetikleme: repository_dispatch (event_type: claude-task, client_payload.task = istek metni)
# Lyra'nın tool'u GitHub API'ye POST atar → bu workflow başlar.
#
# GEREKLİ SECRETS (repo → Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY   — Claude'un bulutta çalışması için
#   TELEGRAM_BOT_TOKEN  — sonuç bildirimi (opsiyonel)
#   TELEGRAM_ADMIN_CHAT_ID — (opsiyonel)
#
# GÜVENLİK: onaysız (Berkay'ın seçimi). Her değişiklik commit olur → yanlışsa `git revert`.

on:
  repository_dispatch:
    types: [claude-task]
  workflow_dispatch:
    inputs:
      task:
        description: 'Lyra görevi (elle test)'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: lyra-autonomous
  cancel-in-progress: false

jobs:
  deniz-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Görevi belirle
        id: task
        run: |
          if [ -n "${{ github.event.client_payload.task }}" ]; then
            echo "text=${{ toJSON(github.event.client_payload.task) }}" >> "$GITHUB_OUTPUT"
          else
            echo "text=${{ toJSON(github.event.inputs.task) }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram — başladı
        if: env.TG_TOKEN != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode text="🤖 Lyra görevi başladı: ${{ github.event.client_payload.task }}${{ github.event.inputs.task }}" >/dev/null || true

      - name: Claude Code — görevi uygula
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Sen bu repoda otonom çalışan bir mühendissin. Berkay sesli asistan Lyra üzerinden şu görevi verdi:

            "${{ github.event.client_payload.task }}${{ github.event.inputs.task }}"

            Kurallar:
            - Görevi tam ve doğru uygula. Frontend işlerinde repo kökündeki CLAUDE.md kurallarına uy.
            - Değişikliği yaptıktan sonra anlamlı bir commit mesajıyla DOĞRUDAN main dalına commit et ve push et (onay akışı yok).
            - Yıkıcı/geniş kapsamlı bir şey gerekiyorsa, güvenli minimal değişikliği yap ve commit mesajında neyi neden yaptığını yaz.
            - Emin olmadığın büyük mimari değişiklikte, riskli kısmı yapma; ne yapmadığını commit mesajında belirt.
          claude_args: '--allowedTools Bash,Edit,Write,Read,Glob,Grep'

      - name: Değişiklikleri main'e it (güvenlik ağı)
        run: |
          git config user.name "Lyra Otonom"
          git config user.email "lyra@kalkaninfo.com"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "lyra: otonom görev uygulandı" || true
          fi
          git push origin main || true

      - name: Telegram — bitti
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode text="✅ Lyra görevi bitti (${{ job.status }}). Son commit: $(git log -1 --oneline). Yanlışsa: git revert HEAD" >/dev/null || true
