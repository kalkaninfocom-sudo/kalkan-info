name: Onaylı postları yayınla (approved → IG/FB)

# KÖK SORUN (2026-07-08): "⏰ 08:00'de Yayınla" ile onaylanan postlar status=approved oluyordu ama
# hiçbir cron onları yayınlamıyordu → sonsuza dek 'approved' çürüyordu (webhook'un inline publishNow'ı
# yalnız "✅ Yayınla Şimdi" için çalışır). api/social-publish-queue.js tam bu işi yapar (approved +
# scheduled_at<=now + published_at null → IG/FB yayın + Telegram bildirim) ama tetikleyicisi yoktu.
# Vercel Hobby cron 2/2 dolu → GitHub Actions saatlik tetikler. Bayat backlog guard'ı endpoint'te
# (PUBLISH_STALE_HOURS=12) → eski gazeteler toplu yayınlanıp IG spamlenmez.

on:
  schedule:
    - cron: '20 * * * *'   # her saat :20 (auto-publish :00 ile çakışmasın)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-approved
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yayın kuyruğunu tetikle (approved → IG/FB)
        env:
          IG_CRON_SECRET: ${{ secrets.IG_CRON_SECRET }}
        run: |
          if [ -z "$IG_CRON_SECRET" ]; then echo "::error::IG_CRON_SECRET secret yok"; exit 1; fi
          # non-www canonical (www 308 redirect → Meta/endpoint davranışını bozar)
          RESP=$(curl -s -w "\n%{http_code}" \
            "https://kalkaninfo.com/api/social-publish-queue?secret=$IG_CRON_SECRET")
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE"
          echo "$BODY"
          # 200 değilse workflow'u kırmızı yap (IG env eksik / secret yanlış görünür olsun)
          if [ "$CODE" != "200" ]; then echo "::error::yayın kuyruğu $CODE döndü"; exit 1; fi
