name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Lint (allow failure during bootstrap)
        run: pnpm exec eslint . --max-warnings 9999 || true
      - name: Multilang build smoke test
        run: pnpm run build:i18n
      - name: Verify JSON data integrity
        run: |
          for f in data/*.json; do
            echo "  $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf-8'))"
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm audit --audit-level=high --prod || true
