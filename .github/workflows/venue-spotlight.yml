# GROUNDED mekan spotlight — gerçek mekan + gerçek foto + doğrulanmış bilgi + 5 dil → Telegram onayı.
# Fix #3: jenerik değil, küratörlü veriye ground içerik (DIY-ChatGPT'nin yapamadığı).
name: Venue spotlight (grounded)

on:
  schedule:
    - cron: '17 6 * * 2,5' # Salı & Cuma 06:17 UTC (~09:17 TR)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  spotlight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer (+ Chrome)
        run: npm install puppeteer@24 --no-save
      - name: Generate grounded spotlight + send to Telegram for approval
        env:
          CHEAP_LLM_ORDER: groq,cerebras,nvidia,gemini,claude
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: node scripts/agency/venue-spotlight.mjs
      - name: Persist rotation state
        run: |
          git config user.name  "kalkan-agency"
          git config user.email "bot@users.noreply.github.com"
          git add data/agency/venue-spotlight-state.json assets/venue-spotlight 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: venue-spotlight state $(date -u +%F)"
          git push || true
