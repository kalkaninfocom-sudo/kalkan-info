name: Gazete sabah onayı (build + web + Telegram)

# SABAH GAZETE AKIŞI — TEK ADANMIŞ WORKFLOW.
# Neden ayrı: agency-scheduler (*/10) GitHub tarafından throttle edilip 07:55 slotunu
# kaçırıyordu; ayrıca scheduler script'leri detached spawn ile CI'da öldürüyor ve
# puppeteer kurmuyordu. Bu workflow üçünü de atlar:
#   - tek günlük cron (belirli 10dk slotu gerekmez; GitHub gecikse de sabah içinde çalışır)
#   - node script'i DOĞRUDAN (senkron) çalıştırır → tamamlanır
#   - puppeteer + Chrome kurar → kapak kartı render edilir
# gazete-approval.mjs içeride newspaper-daily.mjs'i çalıştırır (web + kart + social kuyruk),
# sonra kapak kartını Telegram'a GÖRSELLİ onaya sunar. Ardından arşivi commit+push → Vercel canlı.

on:
  schedule:
    # 04:45 UTC = 07:45 Europe/Istanbul. GitHub gecikmesine tampon (onay ~07:45–08:45 arası).
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Sayı tarihi YYYY-MM-DD (boş = bugün TR)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: gazete-approval
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install puppeteer (+ Chrome)
        run: npm install puppeteer@24 --no-save

      # Faz 1: ajans↔gazete köprüsü — ham RSS'i agent editöryal içeriğe çevir → data/gazete-today.json.
      # cheap-llm CI'da ollama'sız: gemini→nvidia→claude. Başarısızsa graceful atlar, build RSS'e döner.
      - name: Editöryal içerik üret (agent)
        env:
          # Kartsız yetenekli modeller önce (Cerebras/Groq 70B) → nvidia 8B son çare.
          CHEAP_LLM_ORDER: groq,cerebras,nvidia,gemini,claude
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fix F: sabah ajanlarının agency_jobs araştırmasını editöryale bağla (yoksa graceful atlar).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/agency/gazete-editorial.mjs || echo "editöryal atlandı (RSS fallback)"

      # Sabah AUTHORITATIVE: bugüne ait bayat social_posts satırını sil (gece oluşan + telegram_message_id
      # dolu satır, gazete-approval'ın "zaten gönderilmiş" guard'ını tetikleyip sabah onayını bloklıyordu).
      # Silinince gazete-approval taze satır oluşturup taze onay gönderir. Workflow günde 1 çalışır → tek onay.
      - name: Bugünün bayat onay satırını temizle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          D=$(TZ=Europe/Istanbul date +%F)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl -s -X DELETE "$SUPABASE_URL/rest/v1/social_posts?content_pack_id=eq.gazete-$D" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null || true
            echo "bayat satır temizlendi (varsa): gazete-$D"
          else
            echo "Supabase env yok — temizleme atlandı"
          fi

      - name: Gazete üret + kapak render + Telegram görselli onay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_BASE: https://www.kalkaninfo.com
        run: node scripts/agency/gazete-approval.mjs ${{ github.event.inputs.date }}

      # Faz 1.5: Reel için bayat onay satırını temizle (gazete-reel-<tarih>).
      # Gece üretilen + telegram_message_id dolu satır varsa siler → reel-approval taze onay gönderir.
      - name: Reel bayat onay satırını temizle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          D=$(TZ=Europe/Istanbul date +%F)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl -s -X DELETE "$SUPABASE_URL/rest/v1/social_posts?content_pack_id=eq.gazete-reel-$D" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null || true
            echo "bayat reel satırı temizlendi (varsa): gazete-reel-$D"
          else
            echo "Supabase env yok — reel temizleme atlandı"
          fi

      # Faz 1.5: Claude-tasarımı günlük gazete reel'i (aynı editöryal içerikten) → Supabase → Telegram video onayı.
      # Non-fatal: Remotion render CI'da patlarsa gazete akışı bozulmasın (|| echo).
      - name: Günlük gazete reel'i üret + video onayı
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_BASE: https://www.kalkaninfo.com
        run: node scripts/agency/reel-approval.mjs || echo "reel adımı atlandı (gazete akışı etkilenmez)"

      # Faz 1.5-EN: EN reel bayat onay satırını temizle (gazete-reel-en-<tarih>) → taze onay.
      - name: EN reel bayat onay satırını temizle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          D=$(TZ=Europe/Istanbul date +%F)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl -s -X DELETE "$SUPABASE_URL/rest/v1/social_posts?content_pack_id=eq.gazete-reel-en-$D" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null || true
            echo "bayat EN reel satırı temizlendi (varsa): gazete-reel-en-$D"
          else
            echo "Supabase env yok — EN reel temizleme atlandı"
          fi

      # Faz 1.5-EN: İngiliz/uluslararası kitle için EN gazete reel'i (aynı editöryalin çevirisi).
      # build-gazete-reel-en içeride gazete-editorial-en.mjs'i çağırıp gazete-today.en.json üretir (cheap-llm çeviri).
      # Non-fatal: EN çeviri/Remotion CI'da patlarsa TR gazete akışı etkilenmez (|| echo).
      - name: İngilizce gazete reel'i üret + video onayı
        env:
          CHEAP_LLM_ORDER: groq,cerebras,nvidia,gemini,claude
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_BASE: https://www.kalkaninfo.com
        run: node scripts/agency/reel-approval-en.mjs || echo "EN reel adımı atlandı (gazete akışı etkilenmez)"

      - name: Commit & push arşiv (web canlı)
        run: |
          git config user.name "kalkan-info-bot"
          git config user.email "bot@kalkaninfo.com"
          git add newspaper/archive data/newspaper-index.json data/gazete-archive
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "content(gazete): günlük sayı $(TZ=Europe/Istanbul date +%Y-%m-%d) [auto]"
          git pull --rebase origin main || true
          git push
