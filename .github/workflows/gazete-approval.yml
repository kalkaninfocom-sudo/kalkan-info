name: Gazete sabah onayı (build + web + Telegram)

# SABAH GAZETE AKIŞI — TEK ADANMIŞ WORKFLOW.
# Neden ayrı: agency-scheduler (*/10) GitHub tarafından throttle edilip 07:55 slotunu
# kaçırıyordu; ayrıca scheduler script'leri detached spawn ile CI'da öldürüyor ve
# puppeteer kurmuyordu. Bu workflow üçünü de atlar:
#   - tek günlük cron (belirli 10dk slotu gerekmez; GitHub gecikse de sabah içinde çalışır)
#   - node script'i DOĞRUDAN (senkron) çalıştırır → tamamlanır
#   - puppeteer + Chrome kurar → kapak kartı render edilir
# gazete-approval.mjs içeride newspaper-daily.mjs'i çalıştırır (web + kart + social kuyruk),
# sonra kapak kartını Telegram'a GÖRSELLİ onaya sunar. Ardından arşivi commit+push → Vercel canlı.

on:
  schedule:
    # 04:45 UTC = 07:45 Europe/Istanbul. GitHub gecikmesine tampon (onay ~07:45–08:45 arası).
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Sayı tarihi YYYY-MM-DD (boş = bugün TR)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: gazete-approval
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install puppeteer (+ Chrome)
        run: npm install puppeteer@24 --no-save

      # Faz 1 + Tier 2 HABER ODASI: muhabir → editör → doğrulayıcı → şef zinciri → data/gazete-today.json
      # (editorial_review denetim izi dahil). cheap-llm CI'da: groq→cerebras→nvidia→gemini→claude.
      # Başarısızsa graceful atlar, build RSS'e döner. newspaper-daily bunu idempotent görür, tekrar üretmez.
      - name: Haber odası — çok-rollü editöryal (muhabir/editör/doğrulayıcı/şef)
        env:
          # Kartsız yetenekli modeller önce (Cerebras/Groq 70B) → nvidia 8B son çare.
          CHEAP_LLM_ORDER: groq,cerebras,nvidia,gemini,claude
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fix F: sabah ajanlarının agency_jobs araştırmasını editöryale bağla (yoksa graceful atlar).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/agency/gazete-newsroom.mjs || echo "haber odası atlandı (RSS fallback)"

      # Sabah AUTHORITATIVE: bugüne ait bayat social_posts satırını sil (gece oluşan + telegram_message_id
      # dolu satır, gazete-approval'ın "zaten gönderilmiş" guard'ını tetikleyip sabah onayını bloklıyordu).
      # Silinince gazete-approval taze satır oluşturup taze onay gönderir. Workflow günde 1 çalışır → tek onay.
      - name: Bugünün bayat onay satırını temizle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          D=$(TZ=Europe/Istanbul date +%F)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl -s -X DELETE "$SUPABASE_URL/rest/v1/social_posts?content_pack_id=eq.gazete-$D" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null || true
            echo "bayat satır temizlendi (varsa): gazete-$D"
          else
            echo "Supabase env yok — temizleme atlandı"
          fi

      - name: Gazete üret + kapak render + Telegram görselli onay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_BASE: https://www.kalkaninfo.com
          # Kalite kapısı (content-critic → cheap-llm) LLM ister; yoksa her içerik 0/5 "DÜŞÜK PUAN".
          # Ücretsiz hakemler önce (token tasarrufu), claude son çare.
          CRITIC_LLM_ORDER: groq,cerebras,nvidia,gemini,claude
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # i18n çeviri HIZI: gemini önce (güvenilir/cömert), yalnız 2 sağlayıcı → degrade free-tier'da
          # alan başına 60sn×ölü-sağlayıcı israfını sınırla. Cold-cache run 45dk'yı aşıp timeout oluyordu;
          # kök: i18n her alanı her sağlayıcıda 60sn dener, 3 ölü sağlayıcı = 3dk/alan × 40 alan = 30dk+.
          I18N_LLM_ORDER: gemini,groq
          GAZETE_SKIP_I18N: '1'   # TR-ÖNCE: bu adımda çeviri YOK → TR hızlı üretilip yayınlanır; diller commit sonrası best-effort
        run: node scripts/agency/gazete-approval.mjs ${{ github.event.inputs.date }}

      # KRİTİK SIRA: Gazete web'i (HTML+kart) ÜRETİLDİ → HEMEN commit+push (YAYINLA) ve heartbeat.
      # Yavaş reel'lerden ÖNCE. Eski sırada reel adımı 20dk job-timeout'a takılıp job'ı CANCEL edince
      # commit adımı SKIP oluyordu → gazete üretilmesine rağmen 3 gün YAYINLANMADI (08-22..24). Artık reel
      # ne olursa olsun gazete önce yayında.
      - name: Commit & push arşiv (web canlı)
        run: |
          git config user.name "kalkan-info-bot"
          git config user.email "bot@kalkaninfo.com"
          git add newspaper/archive data/newspaper-index.json data/gazete-archive data/gazete-history.json data/i18n-cache
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "content(gazete): günlük sayı $(TZ=Europe/Istanbul date +%Y-%m-%d) [auto]"
          git pull --rebase --autostash origin main || true
          git push || echo "push atlandi (non-fatal)"

      # G1 HEARTBEAT: bugünkü sayı GERÇEKTEN üretildi + yayınlandı mı doğrula. Reel'lerden ÖNCE → her zaman çalışır.
      - name: Heartbeat — bugünkü sayı çıktı mı?
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.GAZETE_HEALTHCHECK_URL }}
        run: node scripts/agency/gazete-heartbeat.mjs --verbose

      # 5-DİL (best-effort): TR YAYINLANDIKTAN SONRA dilleri üret + ayrı commit. Yavaş/degrade free-tier
      # TR yayınını ARTIK engellemez (eskiden çeviri 30-45dk sürüp job'ı timeout'a götürüp TR'yi de düşürüyordu).
      # continue-on-error + 25dk step-timeout: çeviri patlasa/aşsa da job yeşil, TR zaten yayında.
      - name: 5-dil çeviri sayfaları (best-effort, commit sonrası)
        continue-on-error: true
        timeout-minutes: 25
        env:
          I18N_LLM_ORDER: gemini,groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "kalkan-info-bot"; git config user.email "bot@kalkaninfo.com"
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(TZ=Europe/Istanbul date +%F)
          for l in en de ru fr; do
            node newspaper/generator/build.mjs morning  "$D" --lang=$l || echo "morning.$l atlandı"
            node newspaper/generator/build.mjs magazine "$D" --lang=$l || echo "magazine.$l atlandı"
          done
          node scripts/build-newspaper-index.mjs || true
          git add newspaper/archive data/newspaper-index.json data/i18n-cache || true
          if ! git diff --cached --quiet; then
            git commit -m "content(gazete): 5-dil çeviri $D [auto]"
            git pull --rebase --autostash origin main || true
            git push || echo "dil push atlandı"
          else
            echo "dil değişikliği yok"
          fi

      # Faz 1.5: Reel için bayat onay satırını temizle (gazete-reel-<tarih>).
      # Gece üretilen + telegram_message_id dolu satır varsa siler → reel-approval taze onay gönderir.
      - name: Reel bayat onay satırını temizle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          D=$(TZ=Europe/Istanbul date +%F)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl -s -X DELETE "$SUPABASE_URL/rest/v1/social_posts?content_pack_id=eq.gazete-reel-$D" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null || true
            echo "bayat reel satırı temizlendi (varsa): gazete-reel-$D"
          else
            echo "Supabase env yok — reel temizleme atlandı"
          fi

      # Faz 1.5: Claude-tasarımı günlük gazete reel'i (aynı editöryal içerikten) → Supabase → Telegram video onayı.
      # Non-fatal: Remotion render CI'da patlarsa gazete akışı bozulmasın (|| echo).
      - name: Günlük gazete reel'i üret + video onayı
        continue-on-error: true   # reel patlarsa/asılırsa job YEŞİL kalır (gazete zaten yayında)
        timeout-minutes: 10       # asılı Remotion render'ı kes (job'ı 30dk cap'e götürme)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_BASE: https://www.kalkaninfo.com
          # Kalite kapısı LLM ister (yoksa 0/5). Ücretsiz hakemler önce, claude son çare.
          CRITIC_LLM_ORDER: groq,cerebras,nvidia,gemini,claude
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/agency/reel-approval.mjs || echo "reel adımı atlandı (gazete akışı etkilenmez)"

      # Faz 1.5-EN: EN reel bayat onay satırını temizle (gazete-reel-en-<tarih>) → taze onay.
      - name: EN reel bayat onay satırını temizle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          D=$(TZ=Europe/Istanbul date +%F)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl -s -X DELETE "$SUPABASE_URL/rest/v1/social_posts?content_pack_id=eq.gazete-reel-en-$D" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null || true
            echo "bayat EN reel satırı temizlendi (varsa): gazete-reel-en-$D"
          else
            echo "Supabase env yok — EN reel temizleme atlandı"
          fi

      # Faz 1.5-EN: İngiliz/uluslararası kitle için EN gazete reel'i (aynı editöryalin çevirisi).
      # build-gazete-reel-en içeride gazete-editorial-en.mjs'i çağırıp gazete-today.en.json üretir (cheap-llm çeviri).
      # Non-fatal: EN çeviri/Remotion CI'da patlarsa TR gazete akışı etkilenmez (|| echo).
      - name: İngilizce gazete reel'i üret + video onayı
        continue-on-error: true
        timeout-minutes: 10
        env:
          CHEAP_LLM_ORDER: groq,cerebras,nvidia,gemini,claude
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_BASE: https://www.kalkaninfo.com
        run: node scripts/agency/reel-approval-en.mjs || echo "EN reel adımı atlandı (gazete akışı etkilenmez)"
