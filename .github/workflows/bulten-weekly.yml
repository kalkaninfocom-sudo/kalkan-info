name: Haftanın Bülteni reel (Pazar 09:00)

# ADANMIŞ WORKFLOW (gazete-approval / restoran-reel ile aynı gerekçe): Remotion + ffmpeg ağır iş →
# npm ci + ubuntu ffmpeg + Remotion Chrome. Haftanın gazete-archive editöryallerinden özet reel üretir.
# NOT: veri kaynağı = data/gazete-archive/*.json (gazete-editorial her gün yazar + gazete-approval commit'ler).

on:
  schedule:
    # 06:00 UTC = 09:00 Europe/Istanbul, Pazar (0).
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: 'Referans gün YYYY-MM-DD (boş = bugün TR)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bulten-weekly
  cancel-in-progress: false

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: ffmpeg kur (sistem hazir; yoksa apt noninteractive)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then echo "sistem ffmpeg: $(ffmpeg -version | head -1)"; else sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg; fi

      - name: Bağımlılıkları kur (remotion dahil)
        run: npm install --no-audit --no-fund

      # Bugüne ait bayat onay satırını temizle — önceki çalışmada telegram_message_id doluysa
      # bulten-approval "zaten gönderilmiş" guard'ını tetikler. Silince taze onay gönderilir.
      - name: Bayat onay satırını temizle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          D=$(TZ=Europe/Istanbul date +%F)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl -s -X DELETE "$SUPABASE_URL/rest/v1/social_posts?content_pack_id=eq.bulten-reel-$D" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null || true
            echo "bayat satır temizlendi (varsa): bulten-reel-$D"
          else
            echo "Supabase env yok — temizleme atlandı"
          fi

      - name: Haftanın bülteni reel + video onayı
        env:
          CHEAP_LLM_ORDER: groq,cerebras,nvidia,gemini,claude
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          I18N_LLM_ORDER: gemini,groq
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_BASE: https://kalkaninfo.com
        run: node scripts/agency/bulten-approval.mjs ${{ github.event.inputs.date }}
