<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kalkan Info — Kartvizit (85×55mm)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page { size: 91mm 61mm; margin: 0; }

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ font-family:'Inter',sans-serif; background:#e9eef3; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

:root{
  --ink:#0a2e4c;
  --ink-deep:#072136;
  --gold:#e89812;
  --gold-soft:#f4b53d;
  --white:#ffffff;
  --line:rgba(7,33,54,0.12);
}

.card{
  width:91mm; height:61mm;
  page-break-after:always;
  position:relative;
  overflow:hidden;
}
.card:last-child{ page-break-after:auto; }

/* ============== ÖN YÜZ — minimalist ============== */
.front{ background:var(--ink-deep); color:#fff; }
.front-inner{
  position:absolute; inset:0;
  padding:6mm;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center;
}

.brand-mark{
  display:inline-flex; align-items:center; gap:3mm;
  font-family:'Montserrat'; font-weight:900;
  font-size:7mm; letter-spacing:0.04em; color:#fff;
}
.brand-mark .diamond{
  color:var(--gold-soft); font-size:7mm; line-height:0.9;
}

.tagline{
  font-size:2.2mm; letter-spacing:0.42em; text-transform:uppercase;
  font-weight:500; color:rgba(255,255,255,0.55);
  margin-top:5mm;
}

.front-url{
  position:absolute; bottom:6mm; left:50%; transform:translateX(-50%);
  font-size:2.4mm; letter-spacing:0.18em; font-weight:600;
  color:var(--gold-soft);
}

/* ============== ARKA YÜZ — minimal iletişim ============== */
.back{ background:var(--white); }
.back-inner{
  position:absolute; inset:0;
  padding:8mm 10mm;
  display:flex; flex-direction:column; justify-content:space-between;
}

.name-top{ }
.person-name{
  font-family:'Montserrat'; font-weight:800;
  font-size:6.5mm; letter-spacing:-0.025em; color:var(--ink-deep);
  line-height:1;
}
.person-role{
  font-size:2.2mm; letter-spacing:0.32em; text-transform:uppercase;
  font-weight:600; color:var(--gold);
  margin-top:2mm;
}

.divider{
  width:10mm; height:0.4mm; background:var(--gold);
  margin:4mm 0 4mm;
}

.contact-grid{
  display:grid; grid-template-columns:1fr auto; gap:5mm; align-items:end;
}
.contact-list{
  display:grid; gap:1.5mm;
  font-size:2.7mm; line-height:1.4;
  color:var(--ink-deep);
  font-weight:600; letter-spacing:0.005em;
}
.contact-list .label{
  font-size:1.8mm; letter-spacing:0.22em; text-transform:uppercase;
  font-weight:600; color:rgba(7,33,54,0.45);
  margin-bottom:0.2mm;
}

.qr-block{
  display:flex; flex-direction:column; align-items:center; gap:1mm;
}
.qr{
  width:13mm; height:13mm;
  padding:0.6mm; background:#fff;
}
.qr img{ width:100%; height:100%; display:block; }
.qr-label{
  font-size:1.6mm; letter-spacing:0.24em; text-transform:uppercase;
  font-weight:700; color:rgba(7,33,54,0.5);
}

/* Footer marka — gizli (çok karışık olmasın) */
.back-footer{
  font-family:'Montserrat'; font-weight:700;
  font-size:2.4mm; letter-spacing:0.14em; color:var(--ink-deep);
  display:flex; align-items:center; gap:1.5mm;
}
.back-footer .d{ color:var(--gold); font-size:3mm; line-height:1; }

/* ============== Ekran önizleme ============== */
@media screen {
  body{ padding:40px 0; min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:24px; }
  .card{ box-shadow:0 14px 40px rgba(7,33,54,0.18); border-radius:1.5mm; }
  .face-label{
    font-family:'Inter'; font-size:11px; color:#0a2e4c;
    letter-spacing:0.18em; text-transform:uppercase; font-weight:700;
    opacity:0.6;
  }
}
@media print {
  body{ background:#fff; padding:0; }
  .face-label{ display:none; }
  .card{ box-shadow:none; border-radius:0; }
}
</style>
</head>
<body>

<div class="face-label">Ön Yüz</div>
<div class="card front">
  <div class="front-inner">
    <div class="brand-mark">
      <span class="diamond">◆</span>
      <span>KALKAN INFO</span>
    </div>
    <div class="tagline">Yerel Rehber · Concierge</div>
  </div>
  <div class="front-url">kalkaninfo.com</div>
</div>

<div class="face-label">Arka Yüz</div>
<div class="card back">
  <div class="back-inner">
    <div class="name-top">
      <div class="person-name">Berkay Elmastaş</div>
      <div class="person-role">Kurucu</div>
      <div class="divider"></div>
    </div>

    <div class="contact-grid">
      <div class="contact-list">
        <div>
          <div class="label">Telefon</div>
          +90 530 665 07 94
        </div>
        <div>
          <div class="label">E-posta</div>
          concierge@kalkaninfo.com
        </div>
        <div>
          <div class="label">Web</div>
          kalkaninfo.com
        </div>
      </div>
      <div class="qr-block">
        <div class="qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=https%3A%2F%2Fkalkaninfo.com&color=072136&bgcolor=ffffff" alt="QR">
        </div>
        <div class="qr-label">SCAN</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
