<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>360° Sanal Tur — Sistem Demosu | Kalkan Info</title>
<link rel="stylesheet" href="/js/vendor/pannellum.css">
<style>
  :root{--bg:#0d1a14;--panel:#16261d;--accent:#a8d5b0;--text:#ecf3ed;--muted:#8ea895;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:linear-gradient(180deg,rgba(13,26,20,0.95),rgba(13,26,20,0.75));border-bottom:1px solid rgba(168,213,176,0.18);position:sticky;top:0;z-index:5;}
  .bar .brand{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:20px;letter-spacing:0.01em;}
  .bar .brand b{color:var(--accent);}
  .demo-chip{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;color:#0d1a14;background:var(--accent);padding:5px 11px;border-radius:999px;}
  #panorama{width:100%;height:min(72vh,720px);background:var(--panel);}
  .note{max-width:820px;margin:0 auto;padding:18px 20px 40px;color:var(--muted);font-size:14px;line-height:1.6;text-align:center;}
  .note b{color:var(--text);}
  .rooms{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px;}
  .room-btn{background:rgba(168,213,176,0.08);border:1px solid rgba(168,213,176,0.28);color:var(--text);font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;transition:background .18s,transform .18s;}
  .room-btn:hover{background:rgba(168,213,176,0.18);transform:translateY(-1px);}
  .room-btn.active{background:var(--accent);color:#0d1a14;border-color:var(--accent);}
</style>

<link rel="canonical" href="https://kalkaninfo.com/fr/demo/villa-tur/">
<link rel="alternate" hreflang="tr" href="https://kalkaninfo.com/demo/villa-tur/">
<link rel="alternate" hreflang="en" href="https://kalkaninfo.com/en/demo/villa-tur/">
<link rel="alternate" hreflang="de" href="https://kalkaninfo.com/de/demo/villa-tur/">
<link rel="alternate" hreflang="ru" href="https://kalkaninfo.com/ru/demo/villa-tur/">
<link rel="alternate" hreflang="fr" href="https://kalkaninfo.com/fr/demo/villa-tur/">
<link rel="alternate" hreflang="x-default" href="https://kalkaninfo.com/demo/villa-tur/"></head>
<body>
  <div class="bar">
    <div class="brand">◆ VILLA SHIP AHOY <span style="color:var(--muted);font-size:14px;">· Sanal Tur</span></div>
    <span class="demo-chip">DEMO</span>
  </div>

  <div id="panorama"></div>

  <div class="rooms" id="rooms"></div>

  <div class="note">
    Bu bir <b>sistem önizlemesidir</b>. Panoramalar geçici demo görselleridir.<br>
    Villanın gerçek odalarını telefonla 360° çekip gönderdiğinizde, bu turda <b>gerçek villanız</b> görünecek —
    ziyaretçi parmakla bakınıp odalar arasında gezebilecek.
  </div>

  <script src="/js/vendor/pannellum.js"></script>
  <script>
    var SCENES = [
      {id:'salon', title:'Salon',          pano:'/assets/tours/villa-ship-ahoy/salon.jpg', hs:[{yaw:70,pitch:-2,to:'yatak'},{yaw:-110,pitch:-2,to:'havuz'}]},
      {id:'yatak', title:'Yatak Odası',     pano:'/assets/tours/villa-ship-ahoy/yatak.jpg', hs:[{yaw:-90,pitch:-2,to:'salon'}]},
      {id:'havuz', title:'Havuz & Teras',   pano:'/assets/tours/villa-ship-ahoy/havuz.jpg', hs:[{yaw:120,pitch:-2,to:'salon'}]}
    ];
    var titleOf = function(id){ for(var i=0;i<SCENES.length;i++) if(SCENES[i].id===id) return SCENES[i].title; return id; };
    var scenes = {};
    SCENES.forEach(function(s){
      scenes[s.id] = { title:s.title, type:'equirectangular', panorama:s.pano, autoLoad:true,
        hotSpots:(s.hs||[]).map(function(h){ return {pitch:h.pitch,yaw:h.yaw,type:'scene',text:titleOf(h.to),sceneId:h.to}; }) };
    });
    var viewer = pannellum.viewer('panorama', {
      default:{ firstScene:'salon', sceneFadeDuration:900, autoLoad:true, showFullscreenCtrl:true },
      scenes:scenes
    });
    // oda butonları
    var rc = document.getElementById('rooms');
    SCENES.forEach(function(s){
      var b=document.createElement('button');
      b.className='room-btn'+(s.id==='salon'?' active':''); b.textContent=s.title;
      b.onclick=function(){ viewer.loadScene(s.id); };
      rc.appendChild(b);
    });
    viewer.on('scenechange', function(id){
      Array.prototype.forEach.call(rc.children, function(btn){
        btn.classList.toggle('active', btn.textContent===titleOf(id));
      });
    });
  </script>



<script>window.KALKAN_PAGE_LANG="fr";window.setLang=function(l){var langs=['tr','en','de','ru','fr'];if(langs.indexOf(l)<0)return;var base="/demo/villa-tur/index.html";location.href=(l==='tr'?base:'/'+l+base);};</script></body></html>
